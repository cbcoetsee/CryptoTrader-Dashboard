<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bar Replay · Setup Research Dashboard</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg-0:#0a0e14;
  --bg-1:#0d1219;
  --bg-2:#131a24;
  --bg-3:#1a222e;
  --bg-4:#212b38;
  --border:#232c3a;
  --border-strong:#334155;
  --text-1:#eef2f7;
  --text-2:#9aa7b8;
  --text-3:#63707f;
  --amber:#f0a825;
  --amber-strong:#ffc247;
  --amber-bg:rgba(240,168,37,.12);
  --amber-bg-strong:rgba(240,168,37,.22);
  --blue:#5b8def;
  --blue-bg:rgba(91,141,239,.14);
  --up:#20c997;
  --up-bg:rgba(32,201,151,.13);
  --down:#f5495c;
  --down-bg:rgba(245,73,92,.13);
  --neutral:#8b96a5;
  --neutral-bg:rgba(139,150,165,.13);
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --shadow-card:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-pop:0 20px 60px -20px rgba(0,0,0,.7);
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --topbar-h:56px;
  --statusbar-h:40px;
  --tabs-h:46px;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(240,168,37,.05), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(91,141,239,.06), transparent 55%),
    var(--bg-0);
  color:var(--text-1);
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--amber-bg-strong); color:var(--text-1);}
a{color:var(--amber); text-decoration:none;}
button{font-family:inherit;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px; border:2px solid var(--bg-0);}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px; border-radius:4px;}

.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}
.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.up{color:var(--up);}
.down{color:var(--down);}
.neutral-text{color:var(--neutral);}
.text-2{color:var(--text-2);}
.text-3{color:var(--text-3);}
.hidden{display:none !important;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app{min-height:100%; display:flex; flex-direction:column;}

.topbar{
  height:var(--topbar-h);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px;
  background:linear-gradient(180deg, var(--bg-1), var(--bg-0));
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:40;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:30px; height:30px; border-radius:8px;
  background:linear-gradient(155deg, var(--amber), #c9791a);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; color:#1a1206; font-size:15px; font-family:var(--font-mono);
  box-shadow:0 4px 14px -4px rgba(240,168,37,.5);
  flex:none;
}
.brand-text{display:flex; flex-direction:column; line-height:1.15;}
.brand-title{font-weight:700; font-size:14.5px; letter-spacing:.01em; color:var(--text-1);}
.brand-sub{font-size:11px; color:var(--text-3); font-family:var(--font-mono);}

.topbar-actions{display:flex; align-items:center; gap:8px;}

.btn{
  appearance:none; border:1px solid var(--border-strong); background:var(--bg-3);
  color:var(--text-1); padding:8px 14px; border-radius:var(--radius-sm);
  font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  transition:background .12s ease, border-color .12s ease, transform .05s ease;
  white-space:nowrap;
}
.btn:hover{background:var(--bg-4); border-color:#3d4a5c;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--amber); border-color:var(--amber); color:#1a1206;}
.btn-primary:hover{background:var(--amber-strong); border-color:var(--amber-strong);}
.btn-ghost{background:transparent; border-color:transparent; color:var(--text-2);}
.btn-ghost:hover{background:var(--bg-3); color:var(--text-1);}
.btn-sm{padding:5px 10px; font-size:11.5px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn svg{flex:none;}

.statusbar{
  min-height:var(--statusbar-h);
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:8px 20px;
  background:var(--bg-1);
  border-bottom:1px solid var(--border);
  font-size:11.5px;
  color:var(--text-2);
  position:sticky; top:var(--topbar-h); z-index:39;
}
.status-item{display:flex; align-items:center; gap:6px; white-space:nowrap;}
.status-dot{width:7px; height:7px; border-radius:50%; background:var(--text-3); flex:none;}
.status-dot.live{background:var(--up); box-shadow:0 0 0 3px var(--up-bg); animation:pulse 2s infinite;}
.status-dot.warn{background:var(--amber); box-shadow:0 0 0 3px var(--amber-bg);}
.status-dot.err{background:var(--down); box-shadow:0 0 0 3px var(--down-bg);}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.4;}}
.status-label{color:var(--text-3);}
.status-value{color:var(--text-1); font-family:var(--font-mono);}
.status-spacer{flex:1;}
.mode-pill{
  padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700;
  letter-spacing:.03em; text-transform:uppercase; border:1px solid var(--border-strong);
  color:var(--text-2); background:var(--bg-2);
}
.mode-pill.live{color:var(--up); border-color:rgba(32,201,151,.35); background:var(--up-bg);}
.mode-pill.file{color:var(--amber); border-color:rgba(240,168,37,.35); background:var(--amber-bg);}

.banner{
  margin:14px 20px 0; padding:11px 14px; border-radius:var(--radius-md);
  border:1px solid rgba(245,73,92,.3); background:var(--down-bg); color:#ffd7db;
  font-size:12.5px; display:flex; gap:10px; align-items:flex-start;
}
.banner.warn{border-color:rgba(240,168,37,.35); background:var(--amber-bg); color:#ffe5b3;}
.banner.info{border-color:rgba(91,141,239,.3); background:var(--blue-bg); color:#cddcfb;}
.banner strong{color:inherit;}
.banner-close{margin-left:auto; background:none; border:none; color:inherit; opacity:.7; cursor:pointer; font-size:15px; line-height:1;}
.banner-close:hover{opacity:1;}

.tabs{
  display:flex; align-items:flex-end; gap:2px; padding:0 20px;
  background:var(--bg-0); border-bottom:1px solid var(--border);
  position:sticky; top:calc(var(--topbar-h) + var(--statusbar-h)); z-index:38;
  overflow-x:auto;
}
.tab-btn{
  appearance:none; background:transparent; border:none; cursor:pointer;
  color:var(--text-2); font-size:13px; font-weight:600; padding:12px 16px;
  border-bottom:2px solid transparent; white-space:nowrap;
  display:flex; align-items:center; gap:8px;
  transition:color .12s ease;
}
.tab-btn:hover{color:var(--text-1);}
.tab-btn.active{color:var(--text-1); border-bottom-color:var(--amber);}
.tab-count{
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-3); background:var(--bg-3);
  padding:1px 6px; border-radius:999px; border:1px solid var(--border);
}
.tab-btn.active .tab-count{color:var(--amber); border-color:rgba(240,168,37,.3);}

main{flex:1; padding:18px 20px 60px; max-width:1680px; margin:0 auto; width:100%;}

.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ============================================================
   KPI STRIP
   ============================================================ */
.kpi-strip{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(148px,1fr));
  gap:10px; margin-bottom:18px;
}
.kpi-card{
  background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:12px 14px; box-shadow:var(--shadow-card);
}
.kpi-label{font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; font-weight:700;}
.kpi-value{font-family:var(--font-mono); font-size:20px; font-weight:700; letter-spacing:-.02em;}
.kpi-sub{font-size:11px; color:var(--text-2); margin-top:3px; font-family:var(--font-mono);}

/* ============================================================
   CARD / SECTION
   ============================================================ */
.card{
  background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card); margin-bottom:16px; overflow:hidden;
}
.card-head{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:14px 16px; border-bottom:1px solid var(--border);
}
.card-title{font-size:14px; font-weight:700; color:var(--text-1);}
.card-desc{font-size:11.5px; color:var(--text-3); margin-top:2px;}
.card-body{padding:16px;}
.card-head-spacer{flex:1;}

.segmented{
  display:inline-flex; background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:2px; gap:2px;
}
.segmented button{
  appearance:none; border:none; background:transparent; color:var(--text-2);
  font-size:12px; font-weight:600; padding:6px 12px; border-radius:5px; cursor:pointer;
}
.segmented button.active{background:var(--amber); color:#1a1206;}
.segmented button:not(.active):hover{color:var(--text-1);}

.field-label{font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.05em; font-weight:700; margin-bottom:5px; display:block;}

input[type=text],input[type=search],input[type=number],input[type=date],select{
  background:var(--bg-1); border:1px solid var(--border-strong); color:var(--text-1);
  border-radius:var(--radius-sm); padding:7px 10px; font-size:12.5px; font-family:var(--font-sans);
}
input[type=text]:focus,input[type=search]:focus,input[type=number]:focus,input[type=date]:focus,select:focus{
  outline:none; border-color:var(--amber);
}
.search-box{position:relative; display:flex; align-items:center;}
.search-box svg{position:absolute; left:9px; color:var(--text-3); pointer-events:none;}
.search-box input{padding-left:30px; width:220px;}

.chip{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
  font-size:11px; font-weight:600; border:1px solid var(--border-strong); background:var(--bg-3); color:var(--text-2);
}
.chip.on{background:var(--amber-bg); border-color:rgba(240,168,37,.4); color:var(--amber-strong);}
.chip button{background:none;border:none;color:inherit;cursor:pointer;}

.dropdown{position:relative; display:inline-block;}
.dropdown-panel{
  position:absolute; top:calc(100% + 6px); left:0; z-index:50;
  background:var(--bg-3); border:1px solid var(--border-strong); border-radius:var(--radius-md);
  box-shadow:var(--shadow-pop); padding:12px; min-width:240px; max-height:340px; overflow:auto;
}
.dropdown-panel.right{left:auto; right:0;}
.checkline{display:flex; align-items:center; gap:8px; padding:5px 2px; font-size:12.5px; cursor:pointer; border-radius:5px;}
.checkline:hover{background:var(--bg-4);}
.checkline input{accent-color:var(--amber);}
.checkline .count{margin-left:auto; color:var(--text-3); font-family:var(--font-mono); font-size:11px;}

table{width:100%; border-collapse:collapse; font-size:12.5px;}
thead th{
  position:sticky; top:0; background:var(--bg-2); z-index:2;
  text-align:left; padding:9px 12px; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--text-3); font-weight:700; border-bottom:1px solid var(--border); white-space:nowrap;
  cursor:pointer; user-select:none;
}
thead th:hover{color:var(--text-1);}
thead th.sorted{color:var(--amber);}
thead th .sort-arrow{margin-left:4px; opacity:.6; font-size:9px;}
tbody td{padding:9px 12px; border-bottom:1px solid var(--border); color:var(--text-1); vertical-align:middle;}
tbody tr{transition:background .1s ease;}
tbody tr:hover{background:var(--bg-3);}
tbody tr.clickable{cursor:pointer;}
.num-cell{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.table-scroll{overflow:auto; max-height:640px;}
.table-wrap{border-top:1px solid var(--border);}

.badge{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:5px; font-size:11px; font-weight:700; letter-spacing:.02em;}
.badge-win{background:var(--up-bg); color:var(--up);}
.badge-loss{background:var(--down-bg); color:var(--down);}
.badge-be{background:var(--neutral-bg); color:var(--neutral);}
.badge-long{background:var(--blue-bg); color:var(--blue);}
.badge-short{background:var(--amber-bg); color:var(--amber-strong);}
.badge-yes{background:var(--up-bg); color:var(--up);}
.badge-no{background:var(--bg-4); color:var(--text-3);}

.empty-state{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:50px 20px; color:var(--text-2);
}
.empty-state svg{color:var(--text-3); margin-bottom:12px;}
.empty-state h4{font-size:14px; color:var(--text-1); margin:0 0 6px;}
.empty-state p{font-size:12.5px; color:var(--text-3); max-width:420px; margin:0;}

.pf-cell{font-weight:700;}
.bar-cell{position:relative;}
.bar-track{height:4px; border-radius:2px; background:var(--bg-4); overflow:hidden; margin-top:5px; width:100%; min-width:60px;}
.bar-fill{height:100%; border-radius:2px;}

.sig-chip-row{display:flex; flex-wrap:wrap; gap:4px; max-width:420px;}
.sig-chip{background:var(--bg-4); border:1px solid var(--border-strong); border-radius:5px; padding:2px 7px; font-size:11px; color:var(--text-2); font-family:var(--font-mono);}
.sig-chip b{color:var(--text-1); font-weight:700;}

.controls-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:14px 16px; border-bottom:1px solid var(--border);}

.link-btn{background:none; border:none; color:var(--amber); font-size:11.5px; font-weight:700; cursor:pointer; padding:0;}
.link-btn:hover{text-decoration:underline;}

/* ============================================================
   MODAL / SIDE PANEL
   ============================================================ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(5,7,11,.6); backdrop-filter:blur(2px);
  z-index:100; display:flex; justify-content:flex-end;
  animation:fadein .15s ease;
}
.modal-overlay.centered{justify-content:center; align-items:center; padding:20px;}
@keyframes fadein{from{opacity:0;} to{opacity:1;}}
.side-panel{
  width:460px; max-width:92vw; height:100%; background:var(--bg-1); border-left:1px solid var(--border-strong);
  box-shadow:var(--shadow-pop); display:flex; flex-direction:column;
  animation:slidein .18s cubic-bezier(.2,.7,.3,1);
}
@keyframes slidein{from{transform:translateX(24px); opacity:.6;} to{transform:translateX(0); opacity:1;}}
.side-panel-head{
  padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:10px;
}
.side-panel-title{font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.side-panel-sub{font-size:11.5px; color:var(--text-3); margin-top:4px; font-family:var(--font-mono);}
.side-panel-close{margin-left:auto; background:var(--bg-3); border:1px solid var(--border-strong); color:var(--text-2); width:28px; height:28px; border-radius:7px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;}
.side-panel-close:hover{background:var(--bg-4); color:var(--text-1);}
.side-panel-body{flex:1; overflow:auto; padding:16px 18px;}
.side-panel-footer{
  padding:14px 18px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;
  gap:10px; background:var(--bg-1); flex:none;
}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
.form-field{display:flex; flex-direction:column; gap:5px; min-width:0;}
.form-field input, .form-field select{width:100%;}
.form-field.span-2{grid-column:1 / -1;}
.confirm-modal{
  max-width:440px; width:92vw; background:var(--bg-2); border:1px solid var(--border-strong);
  border-radius:var(--radius-lg); box-shadow:var(--shadow-pop); padding:22px;
  animation:slidein .15s ease;
}
.confirm-title{font-size:15px; font-weight:800; margin-bottom:8px; color:var(--text-1);}
.confirm-message{font-size:12.5px; color:var(--text-2); line-height:1.6;}
.confirm-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:18px;}
.btn-danger{background:var(--down); border-color:var(--down); color:#fff;}
.btn-danger:hover{background:#ff5c6e; border-color:#ff5c6e;}
.btn-outline-danger{color:var(--down); border-color:rgba(245,73,92,.35); background:transparent;}
.btn-outline-danger:hover{background:var(--down-bg);}
.record-flag{font-size:10px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; padding:1px 6px; border-radius:4px; background:var(--blue-bg); color:var(--blue);}
.record-flag.edited{background:var(--amber-bg); color:var(--amber-strong);}

.calc-box{
  background:var(--amber-bg); border:1px solid rgba(240,168,37,.35); border-radius:var(--radius-sm);
  padding:9px 11px; font-family:var(--font-mono); font-size:15px; font-weight:700; color:var(--amber-strong);
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
}
.calc-box .calc-hint{font-size:10.5px; font-weight:400; color:var(--text-3); font-family:var(--font-sans);}

.chart-field{position:relative;}
.chart-upload{
  border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); padding:18px;
  text-align:center; color:var(--text-2); font-size:11.5px; background:var(--bg-2); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px; transition:border-color .12s, background .12s;
}
.chart-upload:hover, .chart-upload:focus-visible{border-color:var(--amber); background:var(--bg-3);}
.chart-upload.drag-over{border-color:var(--amber); background:var(--amber-bg);}
.chart-upload b{color:var(--text-1); font-size:12px; font-weight:700;}
.chart-upload.has-image{padding:8px; cursor:default; align-items:stretch;}
.chart-preview{width:100%; max-height:220px; object-fit:contain; border-radius:8px; background:var(--bg-1); display:block;}
.chart-remove{margin-top:8px; align-self:center;}

.chart-gallery-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px;}
.chart-gallery-item{background:var(--bg-3); border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; cursor:pointer; text-align:left; padding:0; transition:border-color .12s;}
.chart-gallery-item:hover{border-color:var(--amber);}
.chart-gallery-item img{width:100%; height:90px; object-fit:cover; display:block; background:var(--bg-1);}
.chart-gallery-cap{padding:6px 8px; font-size:10.5px; color:var(--text-2); font-family:var(--font-mono);}
.chart-gallery-cap b{color:var(--text-1); display:block; font-size:11px; font-family:var(--font-sans); margin-bottom:1px;}

.img-lightbox{
  position:fixed; inset:0; background:rgba(5,7,11,.88); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:32px;
  cursor:zoom-out; animation:fadein .15s ease;
}
.img-lightbox img{max-width:100%; max-height:100%; object-fit:contain; border-radius:10px; box-shadow:0 24px 70px -20px rgba(0,0,0,.85);}
.img-lightbox-close{position:fixed; top:18px; right:22px; background:var(--bg-3); border:1px solid var(--border-strong); color:var(--text-1); width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.img-lightbox-close:hover{background:var(--bg-4);}
.detail-section{margin-bottom:20px;}
.detail-section-title{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.detail-section-title::after{content:""; flex:1; height:1px; background:var(--border);}
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;}
.detail-item{display:flex; flex-direction:column; gap:2px;}
.detail-item .k{font-size:10.5px; color:var(--text-3);}
.detail-item .v{font-size:13px; color:var(--text-1); font-family:var(--font-mono);}
.detail-hero{
  display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;
}
.detail-hero .box{background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px;}
.detail-hero .box .k{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); font-weight:700;}
.detail-hero .box .v{font-family:var(--font-mono); font-size:19px; font-weight:700; margin-top:4px;}

/* ============================================================
   CHARTS
   ============================================================ */
.chart-wrap{position:relative;}
.chart-svg{width:100%; height:auto; display:block;}
.chart-tooltip{
  position:absolute; pointer-events:none; background:var(--bg-4); border:1px solid var(--border-strong);
  border-radius:8px; padding:8px 10px; font-size:11.5px; box-shadow:var(--shadow-pop); opacity:0; transition:opacity .1s;
  z-index:5; white-space:nowrap;
}
.chart-tooltip.show{opacity:1;}
.chart-tooltip .t-date{color:var(--text-3); font-size:10.5px; margin-bottom:3px; font-family:var(--font-mono);}
.chart-tooltip .t-row{display:flex; justify-content:space-between; gap:14px; font-family:var(--font-mono);}

.assumptions{
  font-size:12px; color:var(--text-2); background:var(--bg-1); border:1px dashed var(--border-strong);
  border-radius:var(--radius-md); padding:12px 14px; margin-bottom:16px;
}
.assumptions summary{cursor:pointer; font-weight:700; color:var(--text-1); font-size:12.5px; list-style:none; display:flex; align-items:center; gap:8px;}
.assumptions summary::-webkit-details-marker{display:none;}
.assumptions summary::before{content:"▸"; color:var(--amber); transition:transform .15s;}
.assumptions[open] summary::before{transform:rotate(90deg);}
.assumptions ul{margin:10px 0 0; padding-left:18px;}
.assumptions li{margin-bottom:5px;}

.pill-toggle-group{display:flex; gap:6px; flex-wrap:wrap;}

footer.app-footer{
  padding:20px; text-align:center; color:var(--text-3); font-size:11px; border-top:1px solid var(--border);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 900px){
  .kpi-strip{grid-template-columns:repeat(2,1fr);}
  .search-box input{width:150px;}
  .side-panel{width:100%;}
  .detail-grid{grid-template-columns:1fr;}
  .detail-hero{grid-template-columns:1fr 1fr;}
}
@media (max-width: 600px){
  .topbar{padding:0 12px;}
  .brand-sub{display:none;}
  main{padding:14px 10px 40px;}
  .statusbar{padding:8px 12px;}
  .tabs{padding:0 12px;}
  .card-body{padding:12px;}
  .kpi-strip{grid-template-columns:repeat(2,1fr); gap:8px;}
}
</style>
</head>

  if (f.includes('general') || f.includes('0')) {
    // could still contain y/m/d alongside digits (rare); require a date letter present
  }
  return /[ymdh]/.test(f) && !/^[#0.,\s%$"()+-]*$/.test(f) && /[ymd]/.test(f);
}

async function readSharedStrings(zip) {
  if (!zip.has('xl/sharedStrings.xml')) return [];
  const text = await zip.readText('xl/sharedStrings.xml');
  const doc = parseXML(text);
  const siNodes = Array.from(doc.getElementsByTagName('si'));
  return siNodes.map((si) => {
    // concatenate all <t> text within (handles rich text runs <r><t>...</t></r>)
    const tNodes = si.getElementsByTagName('t');
    let s = '';
    for (let i = 0; i < tNodes.length; i++) s += tNodes[i].textContent;
    return s;
  });
}

async function readStyles(zip) {
  // Returns array: cellXf index -> numFmtId (resolved, including built-ins we care about)
  if (!zip.has('xl/styles.xml')) return { xfNumFmtIds: [], customFormats: {} };
  const text = await zip.readText('xl/styles.xml');
  const doc = parseXML(text);
  const customFormats = {};
  const numFmtsNode = doc.getElementsByTagName('numFmts')[0];
  if (numFmtsNode) {
    Array.from(numFmtsNode.getElementsByTagName('numFmt')).forEach((nf) => {
      customFormats[nf.getAttribute('numFmtId')] = nf.getAttribute('formatCode');
    });
  }
  const cellXfsNode = doc.getElementsByTagName('cellXfs')[0];
  const xfNumFmtIds = [];
  if (cellXfsNode) {
    Array.from(cellXfsNode.childNodes)
      .filter((n) => n.nodeName === 'xf')
      .forEach((xf) => {
        xfNumFmtIds.push(xf.getAttribute('numFmtId'));
      });
  }
  return { xfNumFmtIds, customFormats };
}

async function readWorkbookSheetList(zip) {
  const text = await zip.readText('xl/workbook.xml');
  const doc = parseXML(text);
  const sheetNodes = Array.from(doc.getElementsByTagName('sheet'));
  const sheets = sheetNodes.map((s) => ({
    name: s.getAttribute('name'),
    sheetId: s.getAttribute('sheetId'),
    rId: s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id'),
  }));

  let relsText = null;
  if (zip.has('xl/_rels/workbook.xml.rels')) {
    relsText = await zip.readText('xl/_rels/workbook.xml.rels');
  }
  const relMap = {};
  if (relsText) {
    const relsDoc = parseXML(relsText);
    Array.from(relsDoc.getElementsByTagName('Relationship')).forEach((r) => {
      relMap[r.getAttribute('Id')] = r.getAttribute('Target');
    });
  }
  sheets.forEach((s) => {
    let target = relMap[s.rId];
    if (target) {
      if (!target.startsWith('/') && !target.startsWith('xl/')) target = 'xl/' + target.replace(/^\.?\//, '');
      s.path = target.replace(/^\//, '');
    }
  });
  return sheets;
}

/* ---- data validation ("dropdown list") extraction ---- */

function sqrefToColumnIndices(sqref) {
  const cols = new Set();
  for (const token of sqref.trim().split(/\s+/)) {
    const parts = token.split(':');
    const letters = parts.map((p) => { const m = p.match(COL_LETTERS_RE); return m ? m[1] : null; }).filter(Boolean);
    if (letters.length === 0) continue;
    if (letters.length === 1) { cols.add(colLettersToIndex(letters[0])); continue; }
    const c1 = colLettersToIndex(letters[0]), c2 = colLettersToIndex(letters[1]);
    for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++) cols.add(c);
  }
  return cols;
}

// Only handles inline quoted lists (formula1 = "\"A,B,C\""), by far the most
// common form for a manually-typed dropdown list. Range-reference lists
// (formula1 = "Sheet1!$A$1:$A$5") are left for a column to fall back to its
// observed distinct values instead — still fully usable, just not pulled
// from the workbook's own validation metadata.
function parseInlineListFormula(formula1) {
  if (!formula1) return null;
  const trimmed = formula1.trim();
  if (trimmed.startsWith('"') && trimmed.endsWith('"') && trimmed.length >= 2) {
    return trimmed.slice(1, -1).split(',').map((s) => s.trim()).filter((s) => s.length > 0);
  }
  return null;
}

function readSheetDataValidations(doc) {
  const byColumn = new Map(); // colIndex -> string[] (deduped, order preserved)
  const dvNodes = Array.from(doc.getElementsByTagName('dataValidation'));
  for (const dv of dvNodes) {
    const type = dv.getAttribute('type');
    if (type !== 'list') continue;
    const sqref = dv.getAttribute('sqref');
    if (!sqref) continue;
    let formula1 = null;
    for (let i = 0; i < dv.childNodes.length; i++) {
      if (dv.childNodes[i].nodeName === 'formula1') { formula1 = dv.childNodes[i].textContent; break; }
    }
    const values = parseInlineListFormula(formula1);
    if (!values || values.length === 0) continue;
    const cols = sqrefToColumnIndices(sqref);
    for (const colIdx of cols) {
      if (!byColumn.has(colIdx)) byColumn.set(colIdx, []);
      const arr = byColumn.get(colIdx);
      for (const v of values) if (!arr.includes(v)) arr.push(v);
    }
  }
  return byColumn;
}

/* ---- embedded chart-screenshot images (drawingML) ---- */

function resolveRelativePath(baseDir, target) {
  if (!target) return null;
  if (/^https?:\/\//i.test(target)) return null; // external reference, not embedded
  if (target.startsWith('/')) return target.replace(/^\//, '');
  const parts = baseDir.split('/').concat(target.split('/'));
  const stack = [];
  for (const p of parts) {
    if (p === '' || p === '.') continue;
    if (p === '..') stack.pop();
    else stack.push(p);
  }
  return stack.join('/');
}

function splitDirFile(path) {
  const idx = path.lastIndexOf('/');
  return idx === -1 ? ['', path] : [path.slice(0, idx), path.slice(idx + 1)];
}

// Returns [{ col, row, mediaPath }] — 0-indexed col/row of the image's
// anchor cell, and the zip-internal path to its raw image bytes. Handles the
// two anchor shapes Excel/Sheets actually write (oneCellAnchor for a fixed
// small picture, twoCellAnchor when a picture is stretched across cells) —
// only the anchor's start cell matters for associating an image with a row.
async function readSheetDrawingImages(zip, sheetPath) {
  const [sheetDir, sheetFile] = splitDirFile(sheetPath);
  const sheetRelsPath = `${sheetDir}/_rels/${sheetFile}.rels`;
  if (!zip.has(sheetRelsPath)) return [];
  const sheetRelsDoc = parseXML(await zip.readText(sheetRelsPath));
  let drawingTarget = null;
  Array.from(sheetRelsDoc.getElementsByTagName('Relationship')).forEach((r) => {
    if (/\/drawing$/.test(r.getAttribute('Type') || '')) drawingTarget = r.getAttribute('Target');
  });
  if (!drawingTarget) return [];
  const drawingPath = resolveRelativePath(sheetDir, drawingTarget);
  if (!drawingPath || !zip.has(drawingPath)) return [];
  const drawingDoc = parseXML(await zip.readText(drawingPath));

  const [drawingDir, drawingFile] = splitDirFile(drawingPath);
  const drawingRelsPath = `${drawingDir}/_rels/${drawingFile}.rels`;
  const mediaByRid = {};
  if (zip.has(drawingRelsPath)) {
    const dRelsDoc = parseXML(await zip.readText(drawingRelsPath));
    Array.from(dRelsDoc.getElementsByTagName('Relationship')).forEach((r) => {
      const p = resolveRelativePath(drawingDir, r.getAttribute('Target'));
      if (p) mediaByRid[r.getAttribute('Id')] = p;
    });
  }

  const REL_NS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const images = [];
  for (const tag of ['xdr:oneCellAnchor', 'xdr:twoCellAnchor']) {
    for (const anchor of Array.from(drawingDoc.getElementsByTagName(tag))) {
      const fromNode = anchor.getElementsByTagName('xdr:from')[0];
      if (!fromNode) continue;
      const colNode = fromNode.getElementsByTagName('xdr:col')[0];
      const rowNode = fromNode.getElementsByTagName('xdr:row')[0];
      if (!colNode || !rowNode) continue;
      const col = parseInt(colNode.textContent, 10);
      const row = parseInt(rowNode.textContent, 10);
      const blip = anchor.getElementsByTagName('a:blip')[0];
      if (!blip || !Number.isFinite(col) || !Number.isFinite(row)) continue;
      const rId = blip.getAttribute('r:embed') || blip.getAttributeNS(REL_NS, 'embed');
      const mediaPath = rId ? mediaByRid[rId] : null;
      if (mediaPath) images.push({ col, row, mediaPath });
    }
  }
  return images;
}

const IMAGE_MIME_BY_EXT = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', bmp: 'image/bmp', webp: 'image/webp' };
function guessImageMime(path) {
  const ext = (path.split('.').pop() || '').toLowerCase();
  return IMAGE_MIME_BY_EXT[ext] || 'image/png';
}

// Uint8Array -> base64 without blowing the call-stack on large images (avoid
// String.fromCharCode(...bigArray) with a huge spread/argument list).
function bytesToBase64(bytes) {
  const CHUNK = 0x8000;
  let binary = '';
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}


/**
 * Read one worksheet into a dense matrix of {value, isDate} cells plus the
 * (1-based) max row/col actually populated.
 */
async function readSheetMatrix(zip, sheetPath, sharedStrings, styleInfo) {
  const text = await zip.readText(sheetPath);
  const doc = parseXML(text);
  const rowNodes = Array.from(doc.getElementsByTagName('row'));
  const matrix = [];
  let maxCol = 0;

  const { xfNumFmtIds, customFormats } = styleInfo;

  function cellIsDate(styleIdxAttr) {
    if (styleIdxAttr == null) return false;
    const idx = Number(styleIdxAttr);
    const fmtId = xfNumFmtIds[idx];
    if (fmtId == null) return false;
    if (isDateNumFmtId(fmtId)) return true;
    const custom = customFormats[fmtId];
    if (custom && numFmtStringLooksLikeDate(custom)) return true;
    return false;
  }

  for (const rowNode of rowNodes) {
    const rAttr = rowNode.getAttribute('r');
    const rowIdx = rAttr ? parseInt(rAttr, 10) - 1 : matrix.length;
    while (matrix.length <= rowIdx) matrix.push([]);
    const cellNodes = Array.from(rowNode.childNodes).filter((n) => n.nodeName === 'c');
    for (const c of cellNodes) {
      const ref = c.getAttribute('r');
      let colIdx;
      if (ref) {
        const m = ref.match(COL_LETTERS_RE);
        colIdx = m ? colLettersToIndex(m[1]) : matrix[rowIdx].length;
      } else {
        colIdx = matrix[rowIdx].length;
      }
      const type = c.getAttribute('t');
      const styleIdx = c.getAttribute('s');
      let vNode = null;
      for (let i = 0; i < c.childNodes.length; i++) {
        if (c.childNodes[i].nodeName === 'v') { vNode = c.childNodes[i]; break; }
      }
      let value = null;
      let isDate = false;
      if (type === 's') {
        const idx = vNode ? parseInt(vNode.textContent, 10) : NaN;
        value = Number.isFinite(idx) ? (sharedStrings[idx] ?? '') : '';
      } else if (type === 'inlineStr') {
        const isNode = Array.from(c.childNodes).find((n) => n.nodeName === 'is');
        value = isNode ? isNode.textContent : '';
      } else if (type === 'str') {
        value = vNode ? vNode.textContent : '';
      } else if (type === 'b') {
        value = vNode ? vNode.textContent === '1' : null;
      } else if (type === 'e') {
        value = vNode ? `#${vNode.textContent}` : '#ERR';
      } else {
        // numeric (default, no t attribute) — could be a date serial
        if (vNode && vNode.textContent !== '') {
          const num = Number(vNode.textContent);
          value = Number.isFinite(num) ? num : null;
          if (value !== null && cellIsDate(styleIdx)) {
            isDate = true;
          }
        } else {
          value = null;
        }
      }
      while (matrix[rowIdx].length <= colIdx) matrix[rowIdx].push(null);
      matrix[rowIdx][colIdx] = value === null ? null : { value, isDate };
      if (colIdx + 1 > maxCol) maxCol = colIdx + 1;
    }
  }
  const imageAnchors = await readSheetDrawingImages(zip, sheetPath);
  return { matrix, maxCol, dataValidations: readSheetDataValidations(doc), imageAnchors };
}

/**
 * High-level: open an xlsx ArrayBuffer and return { sheets: [{name, matrix, maxCol, images}] }.
 *
 * `opts.imageMode`:
 *   'inline' (default) — resolve each embedded chart-screenshot image to a
 *       ready-to-use data: URL. Used everywhere in the browser (a live
 *       upload or a server-mode refresh can't write files to disk).
 *   'raw' — resolve to raw bytes + a guessed file extension instead of a
 *       data URL, for a build step that wants to write real image files
 *       to disk (keeps the embedded sample snapshot's HTML small).
 */
async function readWorkbook(arrayBuffer, opts) {
  const imageMode = (opts && opts.imageMode) || 'inline';
  const zip = openZip(arrayBuffer);
  if (!zip.has('xl/workbook.xml')) {
    throw new Error('This file does not look like a valid .xlsx workbook (missing xl/workbook.xml).');
  }
  const [sharedStrings, styleInfo, sheetList] = await Promise.all([
    readSharedStrings(zip),
    readStyles(zip),
    readWorkbookSheetList(zip),
  ]);

  const sheets = [];
  for (const s of sheetList) {
    if (!s.path || !zip.has(s.path)) continue;
    const { matrix, maxCol, dataValidations, imageAnchors } = await readSheetMatrix(zip, s.path, sharedStrings, styleInfo);
    const images = [];
    for (const anchor of imageAnchors) {
      if (!zip.has(anchor.mediaPath)) continue;
      const bytes = await zip.readFile(anchor.mediaPath);
      if (imageMode === 'raw') {
        const ext = (anchor.mediaPath.split('.').pop() || 'png').toLowerCase();
        images.push({ col: anchor.col, row: anchor.row, bytes, ext });
      } else {
        const dataUrl = `data:${guessImageMime(anchor.mediaPath)};base64,${bytesToBase64(bytes)}`;
        images.push({ col: anchor.col, row: anchor.row, dataUrl });
      }
    }
    sheets.push({ name: s.name, matrix, maxCol, dataValidations, images });
  }
  return { sheets };
}

// ---- from data-model.js ----
// data-model.js — schema-agnostic transformation from raw sheet matrices
// (see xlsx-raw.js) into a normalized { meta, records } shape the dashboard
// can render, regardless of the exact column layout of the source workbook.


const BLANK_TOKENS = new Set(['', '-', '—', '–', 'n/a', 'na', 'null', '#n/a']);

function normalizeHeaderText(raw, colIdx) {
  if (raw == null) return `Column ${indexToColLetters(colIdx)}`;
  const s = String(raw).replace(/\s+/g, ' ').trim();
  return s || `Column ${indexToColLetters(colIdx)}`;
}

function indexToColLetters(idx) {
  let n = idx + 1;
  let s = '';
  while (n > 0) {
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function rawCellToPrimitive(cell) {
  if (cell == null) return null;
  if (cell.isDate && typeof cell.value === 'number') {
    return excelSerialToDate(cell.value);
  }
  let v = cell.value;
  if (typeof v === 'string') {
    const trimmed = v.trim();
    if (BLANK_TOKENS.has(trimmed.toLowerCase())) return null;
    return trimmed;
  }
  return v;
}

function parseNumericLoose(raw) {
  if (raw instanceof Date) return null;
  if (typeof raw === 'number') return Number.isFinite(raw) ? raw : null;
  if (typeof raw !== 'string') return null;
  let s = raw.trim();
  if (!s) return null;
  if (BLANK_TOKENS.has(s.toLowerCase())) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  const isPct = /%\s*$/.test(s);
  s = s.replace(/[$,%\s]/g, '');
  if (s === '' || s === '-') return null;
  let n = Number(s);
  if (!Number.isFinite(n)) return null;
  if (isPct) n = n / 100;
  if (neg) n = -Math.abs(n);
  return n;
}

const WEEKDAY_ABBR = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

function parseFlexibleDate(raw, weekdayHint) {
  if (raw instanceof Date && !isNaN(raw)) return raw;
  if (typeof raw === 'number') return excelSerialToDate(raw);
  if (typeof raw !== 'string') return null;
  const s = raw.trim();
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
    const d = new Date(s);
    if (!isNaN(d)) return d;
  }
  const m = s.match(/^(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})$/);
  if (m) {
    const a = +m[1], b = +m[2], c = +m[3];
    const make = (y, mo, da) => {
      if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
      const yy = y < 100 ? 2000 + y : y;
      const d = new Date(Date.UTC(yy, mo - 1, da));
      if (d.getUTCMonth() !== mo - 1) return null;
      return d;
    };
    let candidates = [];
    if (a > 31) {
      candidates.push(make(a, b, c)); // Y-M-D
      candidates.push(make(a, c, b)); // Y-D-M
    } else {
      candidates.push(make(a, b, c)); // YY/MM/DD
      candidates.push(make(c, b, a)); // DD/MM/YY
      candidates.push(make(c, a, b)); // MM/DD/YY
    }
    candidates = candidates.filter(Boolean);
    if (candidates.length === 0) return null;
    if (weekdayHint) {
      const hint = String(weekdayHint).trim().toUpperCase().slice(0, 3);
      const match = candidates.find((d) => WEEKDAY_ABBR[d.getUTCDay()] === hint);
      if (match) return match;
    }
    return candidates[0];
  }
  const d = new Date(s);
  if (!isNaN(d)) return d;
  return null;
}

function weekdayAbbrevUTC(date) {
  return WEEKDAY_ABBR[date.getUTCDay()];
}

// ---- header row detection -------------------------------------------------

function scoreHeaderRow(row) {
  if (!row) return -1;
  let strCount = 0;
  const seen = new Set();
  let dup = 0;
  for (const cell of row) {
    const v = rawCellToPrimitive(cell);
    if (v == null) continue;
    if (typeof v === 'string' && v.length > 0) {
      strCount++;
      const key = v.toLowerCase();
      if (seen.has(key)) dup++; else seen.add(key);
    }
  }
  return strCount - dup * 2;
}

function detectHeaderRowIndex(matrix) {
  const scanRows = Math.min(matrix.length, 10);
  let best = 0, bestScore = -Infinity;
  for (let r = 0; r < scanRows; r++) {
    const sc = scoreHeaderRow(matrix[r]);
    if (sc > bestScore) { bestScore = sc; best = r; }
  }
  return best;
}

// ---- sheet selection --------------------------------------------------

function countDataRows(matrix, headerIdx) {
  let n = 0;
  for (let r = headerIdx + 1; r < matrix.length; r++) {
    const row = matrix[r];
    if (!row) continue;
    const first = rawCellToPrimitive(row[0]);
    if (first != null) n++;
  }
  return n;
}

function pickBestSheet(sheets) {
  if (sheets.length === 1) return sheets[0];
  const named = sheets.filter((s) => /trade|log|journal/i.test(s.name || ''));
  const pool = named.length ? named : sheets;
  let best = pool[0], bestScore = -1;
  for (const s of pool) {
    const headerIdx = detectHeaderRowIndex(s.matrix);
    const rows = countDataRows(s.matrix, headerIdx);
    if (rows > bestScore) { bestScore = rows; best = s; }
  }
  return best;
}

// ---- main extraction --------------------------------------------------

const PNL_KEYWORDS_STRONG = ['actual p&l', 'actual pnl', 'actual p/l', 'actual profit'];
const PNL_KEYWORDS = ['p&l', 'pnl', 'p/l', 'profit/loss', 'profit & loss'];
const PROFIT_ONLY = ['profit'];

const OUTCOME_VOCAB = new Set(['W', 'WIN', 'L', 'LOSS', 'LOSE', 'BE', 'BREAKEVEN', 'B/E', 'P', 'PROFIT', 'WINNER', 'LOSER', 'TIE']);

function classifyPnlCandidate(header, values) {
  const h = header.toLowerCase();
  const hCompact = h.replace(/\s+/g, '');
  const nonBlank = values.filter((v) => v != null);
  if (nonBlank.length === 0) return -Infinity;
  const numeric = nonBlank.filter((v) => typeof v === 'number' || parseNumericLoose(v) !== null);
  const numericRatio = numeric.length / nonBlank.length;
  if (numericRatio < 0.6) return -Infinity;
  if (h.includes('%') || h.includes('percent')) return -Infinity; // that's the % version, not $ source of truth
  if (h.includes('account') || h.includes('balance') || h.includes('size')) return -Infinity;
  if (h.includes('growth')) return -Infinity;

  let score = 0;
  if (PNL_KEYWORDS_STRONG.some((k) => h.includes(k))) score = 100;
  else if (PNL_KEYWORDS.some((k) => hCompact.includes(k.replace(/\s+/g, '')))) score = 50;
  else if (h.includes('profit') && h.includes('loss')) score = 40;
  else if (PROFIT_ONLY.some((k) => h.includes(k))) score = 20;
  else return -Infinity;

  return score + numericRatio * 5;
}

function detectPnlField(headers, records) {
  let best = null, bestScore = -Infinity;
  for (const h of headers) {
    const values = records.map((r) => r[h]);
    const score = classifyPnlCandidate(h, values);
    if (score > bestScore) { bestScore = score; best = h; }
  }
  if (best) return { field: best, confident: true };
  // fallback: any reasonably numeric column not already looking like balance/date/id
  let fallback = null, fallbackRatio = -1;
  for (const h of headers) {
    const hl = h.toLowerCase();
    if (hl.includes('account') || hl.includes('balance') || hl.includes('%') || hl.includes('date') || hl.includes('size')) continue;
    const values = records.map((r) => r[h]).filter((v) => v != null);
    if (!values.length) continue;
    const numeric = values.filter((v) => typeof v === 'number' || parseNumericLoose(v) !== null);
    const ratio = numeric.length / values.length;
    if (ratio > 0.85 && ratio > fallbackRatio) { fallbackRatio = ratio; fallback = h; }
  }
  return { field: fallback, confident: false };
}

function detectDateField(headers, records) {
  const named = headers.find((h) => /date/i.test(h));
  if (named) return named;
  // else the first column, if it parses mostly as dates
  if (headers.length) {
    const h0 = headers[0];
    const values = records.map((r) => r[h0]).filter((v) => v != null);
    const parsed = values.filter((v) => parseFlexibleDate(v) != null);
    if (values.length && parsed.length / values.length > 0.6) return h0;
  }
  return null;
}

function detectOutcomeField(headers, records, pnlField) {
  let best = null, bestScore = -1;
  for (const h of headers) {
    if (h === pnlField) continue;
    const values = records.map((r) => r[h]).filter((v) => v != null);
    if (!values.length) continue;
    const distinct = new Set(values.map((v) => String(v).trim().toUpperCase()));
    if (distinct.size < 2 || distinct.size > 4) continue;
    const inVocab = Array.from(distinct).filter((v) => OUTCOME_VOCAB.has(v));
    if (inVocab.length === 0) continue;
    const score = inVocab.length / distinct.size + values.length / records.length;
    if (score > bestScore) { bestScore = score; best = h; }
  }
  return best;
}

const METRIC_LIKE_EXACT_HINTS = ['growth', 'chart', 'link', 'url', 'note', 'notes', 'comment', 'comments', 'screenshot', 'image'];

function isMetricLikeHeader(h, pnlField, outcomeField, dateField) {
  if (h === pnlField || h === outcomeField || h === dateField) return true;
  const hl = h.toLowerCase();
  if (hl.includes('%') && (hl.includes('p&l') || hl.includes('pnl') || hl.includes('p/l') || hl.includes('profit'))) return true;
  if (hl.includes('account') && (hl.includes('size') || hl.includes('balance'))) return true;
  // Post-trade result fields (e.g. "did this trade pass 1:3 risk-reward?")
  // are outcomes, not pre-trade setup criteria — treat like the outcome
  // field itself rather than a factor to analyze setups by.
  if (hl.includes('passed') && (hl.includes('rr') || hl.includes('risk') || hl.includes('reward'))) return true;
  if (METRIC_LIKE_EXACT_HINTS.some((k) => hl.includes(k))) return true;
  return false;
}

function computeRowDerived(rec, { pnlField, dateField, weekdayField }) {
  const rawPnl = pnlField ? rec[pnlField] : null;
  const pnl = rawPnl == null ? null : parseNumericLoose(rawPnl);
  rec._pnl = pnl;
  rec._hasUsablePnl = pnl != null && Number.isFinite(pnl);
  rec._outcome = !rec._hasUsablePnl ? null : (pnl > 0 ? 'win' : pnl < 0 ? 'loss' : 'breakeven');
  let d = null;
  if (dateField) {
    const hint = weekdayField ? rec[weekdayField] : null;
    d = parseFlexibleDate(rec[dateField], hint);
  }
  rec._date = d;
  rec._dateISO = d ? d.toISOString().slice(0, 10) : null;
  return rec;
}

// Recognizes both an in-session pasted/uploaded image (a data: URL) and a
// pre-extracted historical screenshot (a relative/absolute file path ending
// in a common image extension, as produced by the build-time snapshot
// generator) — both are equally valid "this cell holds a chart image".
function isImageValue(v) {
  if (typeof v !== 'string') return false;
  if (v.startsWith('data:image')) return true;
  return /\.(png|jpe?g|gif|webp|bmp)$/i.test(v.trim());
}

function classifyColumns(headers, records, { pnlField, outcomeField, dateField }) {
  return headers.map((h) => {
    const values = records.map((r) => r[h]);
    const nonBlankVals = values.filter((v) => v != null);
    const numericVals = nonBlankVals.filter((v) => typeof v === 'number' || (typeof v === 'string' && parseNumericLoose(v) != null));
    const numericRatio = nonBlankVals.length ? numericVals.length / nonBlankVals.length : 0;
    const isDateCol = h === dateField || nonBlankVals.some((v) => v instanceof Date);
    const isImageColumn = nonBlankVals.some((v) => isImageValue(v));
    const distinct = new Set(nonBlankVals.map((v) => (v instanceof Date ? v.toISOString().slice(0, 10) : String(v).trim())));
    // Low-cardinality fields behave like categorical setup criteria even when
    // stored as numbers (e.g. Fibonacci levels, leverage tiers) — only treat
    // as a continuous numeric field once it has enough distinct values to not
    // be a meaningful "factor".
    const isNumericContinuous = numericRatio >= 0.7 && distinct.size > 12;
    const type = isDateCol ? 'date' : (isImageColumn ? 'image' : (isNumericContinuous ? 'numeric' : 'categorical'));
    const metricLike = isMetricLikeHeader(h, pnlField, outcomeField, dateField) || isImageColumn;
    const isFactorCandidate = !metricLike && type === 'categorical' && distinct.size >= 2 &&
      distinct.size <= Math.max(2, Math.min(20, Math.ceil(records.length * 0.9))) &&
      nonBlankVals.length >= Math.max(2, records.length * 0.3);
    return {
      header: h,
      type,
      nonBlankCount: nonBlankVals.length,
      numericRatio,
      distinctCount: distinct.size,
      // Never surface actual image data (huge base64 strings) as "distinct
      // values" — that metadata is meant for dropdowns/filters, not blobs.
      distinctValues: (type === 'categorical' && !isImageColumn) ? Array.from(distinct).sort() : [],
      isFactorCandidate,
      isMetricLike: metricLike,
    };
  });
}

/**
 * Re-derive computed fields + column classification after records have been
 * mutated in place (add/edit/delete/clear a trade). Schema-level facts
 * (which field is the P&L field, the date field, the workbook's dropdown
 * lists, etc.) are left untouched — only counts, distinct values, and
 * per-record derived fields are refreshed.
 */
function recomputeDatasetMeta(dataset) {
  const { headers, pnlField, outcomeField, dateField, weekdayField } = dataset.meta;
  for (const rec of dataset.records) computeRowDerived(rec, { pnlField, dateField, weekdayField });
  const columns = classifyColumns(headers, dataset.records, { pnlField, outcomeField, dateField });
  dataset.meta = {
    ...dataset.meta,
    recordCount: dataset.records.length,
    usableRecordCount: dataset.records.filter((r) => r._hasUsablePnl).length,
    columns,
    factorFields: columns.filter((c) => c.isFactorCandidate).map((c) => c.header),
  };
  return dataset;
}

/**
 * Build the normalized dataset from a { name, matrix, maxCol } sheet.
 */
function extractDataset(sheet, fileName) {
  const headerIdx = detectHeaderRowIndex(sheet.matrix);
  const headerRow = sheet.matrix[headerIdx] || [];

  // Determine the true populated column count by scanning every row (plus
  // any embedded image anchors) for the last actually non-blank cell.
  // Excel/Sheets frequently record *formatted-but-empty* cells far to the
  // right of the real data (e.g. from a big "make this a table" selection),
  // which would otherwise get synthesized into meaningless extra columns —
  // sheet.maxCol reflects those too, so it isn't trustworthy on its own.
  let trueMaxCol = 0;
  const considerRow = (row) => {
    if (!row) return;
    for (let c = 0; c < row.length; c++) {
      if (rawCellToPrimitive(row[c]) != null && c + 1 > trueMaxCol) trueMaxCol = c + 1;
    }
  };
  considerRow(headerRow);
  for (let r = headerIdx + 1; r < sheet.matrix.length; r++) considerRow(sheet.matrix[r]);
  if (sheet.images) {
    for (const img of sheet.images) if (img.col + 1 > trueMaxCol) trueMaxCol = img.col + 1;
  }
  const colCount = Math.max(trueMaxCol, 1);

  const headers = [];
  const seen = new Set();
  for (let c = 0; c < colCount; c++) {
    let h = normalizeHeaderText(rawCellToPrimitive(headerRow[c]), c);
    let base = h, i = 2;
    while (seen.has(h)) { h = `${base} (${i++})`; }
    seen.add(h);
    headers.push(h);
  }

  const records = [];
  let scannedRows = 0;
  for (let r = headerIdx + 1; r < sheet.matrix.length; r++) {
    const row = sheet.matrix[r] || [];
    const first = rawCellToPrimitive(row[0]);
    scannedRows++;
    if (first == null) continue;
    const rec = { _sourceRow: r + 1 };
    let nonBlank = 0;
    for (let c = 0; c < headers.length; c++) {
      const v = rawCellToPrimitive(row[c]);
      rec[headers[c]] = v;
      if (v != null) nonBlank++;
    }
    if (nonBlank < 1) continue;
    records.push(rec);
  }

  // Overlay embedded chart-screenshot images onto whichever record/column
  // they're anchored to (by cell position) — this is how a workbook's
  // already-pasted-in screenshots become visible without the person having
  // to re-attach anything.
  if (sheet.images && sheet.images.length) {
    const bySourceRow = new Map(records.map((r) => [r._sourceRow, r]));
    for (const img of sheet.images) {
      const header = headers[img.col];
      if (!header) continue;
      const rec = bySourceRow.get(img.row + 1);
      if (rec && img.dataUrl) rec[header] = img.dataUrl;
    }
  }

  const { field: pnlField, confident: pnlConfident } = detectPnlField(headers, records);
  const dateField = detectDateField(headers, records);
  const outcomeField = detectOutcomeField(headers, records, pnlField);
  const weekdayField = headers.find((h) => /day of week|weekday/i.test(h)) || null;

  // attach computed fields per record
  for (const rec of records) computeRowDerived(rec, { pnlField, dateField, weekdayField });

  // column classification
  const columns = classifyColumns(headers, records, { pnlField, outcomeField, dateField });

  const usableRecords = records.filter((r) => r._hasUsablePnl);

  // Workbook-authored dropdown lists (Excel/Sheets data validation), keyed
  // by header text — e.g. "Day of Week" -> ["MON",...,"SUN"]. Used to build
  // real <select> dropdowns in the add/edit trade form instead of free text.
  const columnDropdowns = {};
  if (sheet.dataValidations) {
    for (const [colIdx, values] of sheet.dataValidations.entries()) {
      if (colIdx < headers.length && values && values.length) columnDropdowns[headers[colIdx]] = values;
    }
  }

  return {
    meta: {
      fileName: fileName || 'workbook.xlsx',
      sheetName: sheet.name,
      headerRowExcelIndex: headerIdx + 1,
      scannedRows,
      recordCount: records.length,
      usableRecordCount: usableRecords.length,
      pnlField,
      pnlFieldConfident: pnlConfident,
      dateField,
      outcomeField,
      weekdayField,
      columns,
      factorFields: columns.filter((c) => c.isFactorCandidate).map((c) => c.header),
      headers,
      columnDropdowns,
    },
    records,
  };
}

function buildDataset(workbookResult, fileName) {
  const sheet = pickBestSheet(workbookResult.sheets);
  if (!sheet) throw new Error('No worksheets found in this workbook.');
  return extractDataset(sheet, fileName);
}

// ---- from analytics.js ----
// analytics.js — pure functions turning usable trade records into the
// metrics the dashboard displays. No DOM access, easy to unit test.

function computeMetrics(pnls) {
  const trades = pnls.length;
  const wins = pnls.filter((p) => p > 0);
  const losses = pnls.filter((p) => p < 0);
  const breakeven = pnls.filter((p) => p === 0);
  const totalPnl = pnls.reduce((a, p) => a + p, 0);
  const winSum = wins.reduce((a, p) => a + p, 0);
  const lossSum = losses.reduce((a, p) => a + p, 0); // negative
  const winRate = trades ? wins.length / trades : null;
  const avgPnl = trades ? totalPnl / trades : null;
  const avgWinner = wins.length ? winSum / wins.length : null;
  const avgLoser = losses.length ? lossSum / losses.length : null;
  let profitFactor;
  if (lossSum === 0) profitFactor = winSum > 0 ? Infinity : null;
  else profitFactor = winSum / Math.abs(lossSum);
  const expectancy = avgPnl;
  return {
    trades, wins: wins.length, losses: losses.length, breakeven: breakeven.length,
    winRate, totalPnl, avgPnl, avgWinner, avgLoser, profitFactor, expectancy,
  };
}

function emptyMetrics() {
  return {
    trades: 0, wins: 0, losses: 0, breakeven: 0, winRate: null,
    totalPnl: 0, avgPnl: null, avgWinner: null, avgLoser: null,
    profitFactor: null, expectancy: null,
  };
}

/**
 * Flattened single-factor breakdown: every (field, value) pair across the
 * given fields, each treated as an independent group.
 */
function factorBreakdown(records, fields) {
  const groups = new Map(); // key: field|||value
  for (const rec of records) {
    if (!rec._hasUsablePnl) continue;
    for (const field of fields) {
      const raw = rec[field];
      if (raw == null) continue;
      const value = String(raw).trim();
      if (!value) continue;
      const key = field + '\u0000' + value;
      if (!groups.has(key)) groups.set(key, { field, value, pnls: [] });
      groups.get(key).pnls.push(rec._pnl);
    }
  }
  const rows = [];
  for (const { field, value, pnls } of groups.values()) {
    rows.push({ field, value, ...computeMetrics(pnls) });
  }
  rows.sort((a, b) => b.totalPnl - a.totalPnl);
  return rows;
}

/**
 * Multi-factor "setup signature" breakdown: groups by the full tuple of
 * values across the selected fields, requiring `minTrades` occurrences.
 */
function setupSignatures(records, fields, minTrades = 2) {
  const groups = new Map();
  for (const rec of records) {
    if (!rec._hasUsablePnl) continue;
    if (fields.length === 0) continue;
    const parts = [];
    let skip = false;
    for (const field of fields) {
      const raw = rec[field];
      if (raw == null) { skip = true; break; }
      parts.push(String(raw).trim());
    }
    if (skip) continue;
    const key = parts.join('\u0000');
    if (!groups.has(key)) groups.set(key, { signature: fields.map((f, i) => ({ field: f, value: parts[i] })), pnls: [] });
    groups.get(key).pnls.push(rec._pnl);
  }
  const rows = [];
  for (const { signature, pnls } of groups.values()) {
    if (pnls.length < minTrades) continue;
    rows.push({ signature, ...computeMetrics(pnls) });
  }
  rows.sort((a, b) => b.totalPnl - a.totalPnl);
  return rows;
}

/**
 * Chronological equity curve + drawdown series.
 * Ordering: by parsed date ascending; ties broken by original source row
 * order (an explicit, stated assumption — the workbook has no intraday
 * timestamp to disambiguate same-day trades).
 */
function equityCurve(records, opts = {}) {
  const usable = records.filter((r) => r._hasUsablePnl);
  const sorted = [...usable].sort((a, b) => {
    const at = a._date ? a._date.getTime() : Infinity;
    const bt = b._date ? b._date.getTime() : Infinity;
    if (at !== bt) return at - bt;
    return a._sourceRow - b._sourceRow;
  });

  let startingBalance = opts.startingBalance;
  let startingBalanceSource = 'assumed-zero';
  if (startingBalance == null) {
    if (opts.balanceField && sorted.length) {
      const first = sorted[0];
      const bal = first[opts.balanceField];
      const balNum = typeof bal === 'number' ? bal : null;
      if (balNum != null) {
        startingBalance = balNum - first._pnl;
        startingBalanceSource = 'derived-from-balance-column';
      }
    }
  } else {
    startingBalanceSource = 'user-specified';
  }
  if (startingBalance == null) { startingBalance = 0; startingBalanceSource = 'assumed-zero'; }

  let running = startingBalance;
  let peak = startingBalance;
  let maxDrawdown = 0; // most negative
  let maxDrawdownPct = 0;
  const points = [];
  for (const rec of sorted) {
    running += rec._pnl;
    if (running > peak) peak = running;
    const dd = running - peak;
    const ddPct = peak !== 0 ? dd / peak : 0;
    if (dd < maxDrawdown) { maxDrawdown = dd; maxDrawdownPct = ddPct; }
    points.push({
      sourceRow: rec._sourceRow,
      date: rec._date,
      dateISO: rec._dateISO,
      pnl: rec._pnl,
      equity: running,
      peak,
      drawdown: dd,
      drawdownPct: ddPct,
    });
  }

  // streaks
  let curWinStreak = 0, curLossStreak = 0, bestWinStreak = 0, worstLossStreak = 0;
  for (const rec of sorted) {
    if (rec._pnl > 0) { curWinStreak++; curLossStreak = 0; }
    else if (rec._pnl < 0) { curLossStreak++; curWinStreak = 0; }
    else { curWinStreak = 0; curLossStreak = 0; }
    if (curWinStreak > bestWinStreak) bestWinStreak = curWinStreak;
    if (curLossStreak > worstLossStreak) worstLossStreak = curLossStreak;
  }

  const best = sorted.reduce((m, r) => (m == null || r._pnl > m._pnl ? r : m), null);
  const worst = sorted.reduce((m, r) => (m == null || r._pnl < m._pnl ? r : m), null);

  return {
    startingBalance, startingBalanceSource,
    endingBalance: running,
    netPnl: running - startingBalance,
    maxDrawdown, maxDrawdownPct,
    bestWinStreak, worstLossStreak,
    bestTrade: best, worstTrade: worst,
    points,
  };
}

/* ============================================================
   FORMATTING HELPERS
   ============================================================ */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function fmtDateUTC(d, opts) {
  if (!d) return null;
  const short = opts && opts.short;
  if (short) return `${String(d.getUTCDate()).padStart(2,'0')} ${MONTHS[d.getUTCMonth()]} '${String(d.getUTCFullYear()).slice(2)}`;
  return `${WD[d.getUTCDay()]}, ${String(d.getUTCDate()).padStart(2,'0')} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}
function fmtMoney(n, opts) {
  opts = opts || {};
  if (n == null || !isFinite(n)) return '—';
  const sign = n < 0 ? '-' : (opts.plus && n > 0 ? '+' : '');
  const v = Math.abs(n);
  return sign + '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPct(n, opts) {
  opts = opts || {};
  if (n == null || !isFinite(n)) return '—';
  const sign = opts.plus && n > 0 ? '+' : '';
  return sign + (n * 100).toLocaleString('en-US', { minimumFractionDigits: opts.decimals ?? 1, maximumFractionDigits: opts.decimals ?? 1 }) + '%';
}
function fmtPF(pf) {
  if (pf == null) return '—';
  if (!isFinite(pf)) return '∞';
  return pf.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtInt(n) { return n == null ? '—' : n.toLocaleString('en-US'); }
function fmtNum(n, d) {
  if (n == null || !isFinite(n)) return '—';
  return n.toLocaleString('en-US', { minimumFractionDigits: d ?? 2, maximumFractionDigits: d ?? 2 });
}
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function displayValue(v) {
  if (v == null) return '—';
  if (v instanceof Date) return fmtDateUTC(v);
  return String(v);
}
function pnlClass(n) { return n > 0 ? 'up' : n < 0 ? 'down' : 'neutral-text'; }
function outcomeBadge(outcome) {
  if (outcome === 'win') return '<span class="badge badge-win">WIN</span>';
  if (outcome === 'loss') return '<span class="badge badge-loss">LOSS</span>';
  if (outcome === 'breakeven') return '<span class="badge badge-be">B/E</span>';
  return '<span class="badge badge-be">—</span>';
}
function yesNoBadge(v) {
  const s = String(v).trim().toLowerCase();
  if (s === 'yes' || s === 'y' || s === 'true') return `<span class="badge badge-yes">${esc(v)}</span>`;
  if (s === 'no' || s === 'n' || s === 'false') return `<span class="badge badge-no">${esc(v)}</span>`;
  return esc(v);
}
function directionBadge(v) {
  const s = String(v).trim().toLowerCase();
  if (s === 'long' || s === 'buy') return `<span class="badge badge-long">${esc(v)}</span>`;
  if (s === 'short' || s === 'sell') return `<span class="badge badge-short">${esc(v)}</span>`;
  return esc(v);
}
function looksLikeDirectionField(header) { return /long.*short|side|direction/i.test(header); }
function looksLikeYesNo(distinctValues) {
  if (!distinctValues || distinctValues.length === 0 || distinctValues.length > 2) return false;
  return distinctValues.every((v) => /^(yes|no|y|n|true|false)$/i.test(v));
}

  sourceMeta: { mode: 'embedded', fileName: '', lastRefresh: null },
  activeTab: 'setup',
  banners: [],
  hasManualEdits: false,
  startingBalanceOverride: null, // null = auto-detect from workbook; a number = user-configured
  setup: {

    signature: { fields: null, search: '', sortKey: 'totalPnl', sortDir: 'desc', minTrades: 2 },
  },

    sortKey: '_date', sortDir: 'asc', pendingFocusRow: null,
  },
  serverPoll: { active: false, timer: null, manifestFile: null, lastHash: null },
};

function computeUsable() {
  return state.dataset.records.filter((r) => r._hasUsablePnl);
}

/* ============================================================
   DATASET LOADING / VALIDATION
   ============================================================ */
function reviveDataset(json) {
  // Reconstruct Date objects from ISO strings stored under _date.
  for (const rec of json.records) {
    if (rec._date) rec._date = new Date(rec._date);
  }
  return json;
}

function cloneDatasetShape(dataset) {
  // Shallow-ish clone sufficient for field-override mutation.
  return {
    meta: { ...dataset.meta, columns: dataset.meta.columns.map((c) => ({ ...c })) },
    records: dataset.records.map((r) => ({ ...r })),
  };
}

function applyPnlFieldOverride(dataset, field) {
  const ds = cloneDatasetShape(dataset);
  ds.meta.pnlField = field;
  ds.meta.pnlFieldConfident = true;
  ds.meta.pnlFieldManual = true;
  for (const rec of ds.records) {
    const raw = field ? rec[field] : null;
    const pnl = raw == null ? null : parseNumericLoose(raw);
    rec._pnl = pnl;
    rec._hasUsablePnl = pnl != null && Number.isFinite(pnl);
    rec._outcome = !rec._hasUsablePnl ? null : (pnl > 0 ? 'win' : pnl < 0 ? 'loss' : 'breakeven');
  }
  ds.meta.usableRecordCount = ds.records.filter((r) => r._hasUsablePnl).length;
  return ds;
}

function validateDataset(dataset) {
  const warnings = [];
  const m = dataset.meta;
  if (m.recordCount === 0) {
    warnings.push({ level: 'error', text: `We scanned ${m.scannedRows} row(s) in "${m.sheetName}" but found no usable trade records. Check that the first column of each trade row (e.g. a date or ID) is filled in.` });
  }
  if (!m.pnlField) {
    warnings.push({ level: 'error', text: `We couldn't confidently detect a P&L column in this workbook. Pick the correct column below to enable performance metrics.`, needsPnlPicker: true });
  } else if (!m.pnlFieldConfident) {
    warnings.push({ level: 'warn', text: `Using a best guess for the P&L column: "${m.pnlField}". Confirm or change it if that's wrong.`, needsPnlPicker: true });
  } else if (m.usableRecordCount === 0) {
    warnings.push({ level: 'warn', text: `Found a P&L column ("${m.pnlField}") but no numeric values in it — performance metrics will be empty until real P&L numbers are present.` });
  }
  if (!m.dateField) {
    warnings.push({ level: 'info', text: `No date column detected — the equity curve will use the row order in the sheet instead of chronological order.` });
  }
  return warnings;
}

function setDataset(dataset, sourceInfo) {
  injectSyntheticFields(dataset);
  state.dataset = dataset;
  state.sourceMeta = { ...state.sourceMeta, ...sourceInfo, lastRefresh: new Date() };
  state.banners = validateDataset(dataset).map((w, i) => ({ id: 'v' + i, ...w }));
  // reset per-dataset selections to sensible defaults tied to available fields
  const factorFields = dataset.meta.factorFields;
  state.setup.single.fields = new Set(factorFields);
  state.setup.signature.fields = pickDefaultSignatureFields(factorFields);
  state.ledger.filters = {};
  state.ledger.outcomeFilter = new Set();
  state.ledger.dateFrom = null;
  state.ledger.dateTo = null;
  state.ledger.search = '';
  renderAll();
}

function pickDefaultSignatureFields(factorFields) {
  const preferredOrder = ['TOKEN', 'SYMBOL', 'PAIR', 'LONG/ SHORT', 'DIRECTION', 'SIDE'];
  const found = [];
  for (const pref of preferredOrder) {
    const match = factorFields.find((f) => f.toUpperCase() === pref || f.toUpperCase().includes(pref));
    if (match && !found.includes(match)) found.push(match);
    if (found.length === 2) break;
  }
  if (found.length >= 2) return new Set(found);
  return new Set(factorFields.slice(0, Math.min(2, factorFields.length)));
}


/* ============================================================
   STATUS BAR + BANNERS
   ============================================================ */
function renderStatusBar() {
  const el = document.getElementById('statusBar');

function truncateMiddle(s, max) {
  if (!s || s.length <= max) return s || '';
  const half = Math.floor((max - 1) / 2);
  return s.slice(0, half) + '…' + s.slice(s.length - half);
}

function getSetupRows() {
  const mode = state.setup.mode;
  const s = state.setup[mode];
  const fields = Array.from(s.fields);
  let rows;
  if (mode === 'single') {
    rows = factorBreakdown(state.dataset.records, fields);
  } else {
    rows = fields.length >= 1 ? setupSignatures(state.dataset.records, fields, Math.max(2, s.minTrades)) : [];
  }
  if (s.search.trim()) {
    const q = s.search.trim().toLowerCase();
    rows = rows.filter((r) => {
      if (mode === 'single') return (r.field + ' ' + r.value).toLowerCase().includes(q);
      return r.signature.some((p) => (p.field + ' ' + p.value).toLowerCase().includes(q));
    });
  }
  rows = sortRows(rows, s.sortKey, s.sortDir);
  return rows;
}

function sortRows(rows, key, dir) {
  const mul = dir === 'asc' ? 1 : -1;
  const sorted = [...rows].sort((a, b) => {
    let av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (!isFinite(av) && isFinite(bv)) return -1 * mul; // Infinity profit factor sorts first on desc
    if (isFinite(av) && !isFinite(bv)) return 1 * mul;
    if (typeof av === 'string') return av.localeCompare(bv) * mul;
    return (av - bv) * mul;
  });
  return sorted;
}

function ledgerDisplayColumns() {
  const m = state.dataset.meta;
  const cols = [];
  cols.push({ key: '_date', label: m.dateField || 'Row', kind: 'date' });
  const priority = ['TOKEN', 'SYMBOL', 'PAIR'].map((p) => m.columns.find((c) => c.header.toUpperCase() === p)?.header).filter(Boolean);
  const directionField = m.columns.find((c) => looksLikeDirectionField(c.header))?.header;
  const shown = new Set(['_date']);
  for (const f of priority) { if (!shown.has(f)) { cols.push({ key: f, label: f, kind: 'text' }); shown.add(f); } }
  if (directionField && !shown.has(directionField)) { cols.push({ key: directionField, label: directionField, kind: 'direction' }); shown.add(directionField); }
  // add up to 3 more informative factor fields
  let extra = 0;
  for (const f of m.factorFields) {
    if (shown.has(f)) continue;
    if (extra >= 3) break;
    cols.push({ key: f, label: f, kind: 'text' });
    shown.add(f);
    extra++;
  }
  if (m.outcomeField) cols.push({ key: '_outcome', label: 'Outcome', kind: 'outcome' });
  if (m.pnlField) cols.push({ key: '_pnl', label: m.pnlField, kind: 'pnl' });
  const pctField = m.columns.find((c) => /%/.test(c.header) && /p&l|pnl|p\/l|profit/i.test(c.header))?.header;
  if (pctField) cols.push({ key: pctField, label: pctField, kind: 'pct' });
  return cols;
}

function activeLedgerFilterCount() {
  let n = 0;
  for (const k in state.ledger.filters) n += state.ledger.filters[k].size;
  if (state.ledger.outcomeFilter.size) n += state.ledger.outcomeFilter.size;
  if (state.ledger.dateFrom) n++;
  if (state.ledger.dateTo) n++;
  return n;
}

function getLedgerRows() {
  let rows = state.dataset.records.slice();
  const st = state.ledger;
  if (st.search.trim()) {
    const q = st.search.trim().toLowerCase();
    rows = rows.filter((r) => state.dataset.meta.headers.some((h) => {
      const v = r[h];
      if (v == null) return false;
      return String(v instanceof Date ? fmtDateUTC(v) : v).toLowerCase().includes(q);
    }));
  }
  for (const field in st.filters) {
    const set = st.filters[field];
    if (!set || set.size === 0) continue;
    rows = rows.filter((r) => r[field] != null && set.has(String(r[field]).trim()));
  }
  if (st.outcomeFilter.size) {
    rows = rows.filter((r) => r._outcome && st.outcomeFilter.has(r._outcome));
  }
  if (st.dateFrom) {
    const from = new Date(st.dateFrom + 'T00:00:00Z').getTime();
    rows = rows.filter((r) => r._date && r._date.getTime() >= from);
  }
  if (st.dateTo) {
    const to = new Date(st.dateTo + 'T23:59:59Z').getTime();
    rows = rows.filter((r) => r._date && r._date.getTime() <= to);
  }
  rows = sortLedgerRows(rows, st.sortKey, st.sortDir);
  return rows;
}

function sortLedgerRows(rows, key, dir) {
  const mul = dir === 'asc' ? 1 : -1;
  return [...rows].sort((a, b) => {
    let av = key === '_date' ? (a._date ? a._date.getTime() : -Infinity) : a[key];
    let bv = key === '_date' ? (b._date ? b._date.getTime() : -Infinity) : b[key];
    if (av == null && bv == null) return (a._sourceRow - b._sourceRow) * mul;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv) * mul || (a._sourceRow - b._sourceRow);
    return (av - bv) * mul || (a._sourceRow - b._sourceRow);
  });
}
