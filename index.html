function renderLedgerCell(r, col) {
  switch (col.kind) {
    case 'date': {
      const d = r._date;
      return d ? `<span title="${esc(String(r[state.dataset.meta.dateField]))}">${fmtDateUTC(d, { short: true })}</span>` : esc(displayValue(r[state.dataset.meta.dateField]));
    }
    case 'direction': return directionBadge(r[col.key]);
    case 'outcome': return outcomeBadge(r._outcome);
    case 'pnl': return `<span class="${pnlClass(r._pnl)}">${fmtMoney(r._pnl, { plus: true })}</span>`;
    case 'pct': {
      const raw = r[col.key];
      const n = typeof raw === 'number' ? raw : parseNumericLoose(raw);
      return n == null ? '—' : `<span class="${pnlClass(n)}">${fmtPct(n, { plus: true })}</span>`;
    }
    default: {
      const raw = r[col.key];
      if (raw == null) return '<span class="text-3">—</span>';
      if (/^(yes|no)$/i.test(String(raw).trim())) return yesNoBadge(raw);
      return esc(raw);
    }
  }
}

function renderLedgerRow(r, cols) {
  return `<tr class="clickable" data-row-detail="${r._sourceRow}">
    ${cols.map((c) => `<td class="${c.kind === 'pnl' || c.kind === 'pct' ? 'num-cell' : ''}">${renderLedgerCell(r, c)}</td>`).join('')}
    <td><button class="link-btn" data-row-detail="${r._sourceRow}">Details →</button></td>
  </tr>`;
}

/* ============================================================
   TRADE DETAIL SIDE PANEL
   ============================================================ */
const CLOSE_ICON_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function recordProvenanceBadge(rec) {
  if (rec._userAdded) return '<span class="record-flag">Added this session</span>';
  if (rec._userEdited) return '<span class="record-flag edited">Edited this session</span>';
  return '';
}

function openTradeDetail(sourceRow) {
  const rec = state.dataset.records.find((r) => r._sourceRow === sourceRow);
  if (!rec) return;
  const m = state.dataset.meta;
  const overlay = document.getElementById('modalOverlay');

  const usableSorted = computeUsable().slice().sort((a, b) => (a._date?.getTime() ?? 0) - (b._date?.getTime() ?? 0) || a._sourceRow - b._sourceRow);
  const idx = usableSorted.findIndex((r) => r._sourceRow === sourceRow);
  let cumPnl = null, runningBalance = null, rankInfo = '';
  if (idx >= 0) {
    cumPnl = usableSorted.slice(0, idx + 1).reduce((a, r) => a + r._pnl, 0);
    const eq = getEquityCurve();
    const pt = eq.points.find((p) => p.sourceRow === sourceRow);
    runningBalance = pt ? pt.equity : null;
    const rankDesc = [...usableSorted].sort((a, b) => b._pnl - a._pnl);
    const rank = rankDesc.findIndex((r) => r._sourceRow === sourceRow) + 1;
    rankInfo = `#${rank} of ${usableSorted.length} by P&L`;
  }

  const directionField = m.columns.find((c) => looksLikeDirectionField(c.header))?.header;
  const tokenField = ['TOKEN','SYMBOL','PAIR'].map(p => m.columns.find(c=>c.header.toUpperCase()===p)?.header).find(Boolean);
  const pctField = findPctField(m);
  const chartField = findChartField(m);
  const profitPassedField = findProfitPassedField(m);

  const factorItems = m.factorFields.filter((f) => f !== directionField && f !== tokenField).map((f) => `
    <div class="detail-item"><span class="k">${esc(f)}</span><span class="v">${renderRawFieldValue(rec[f])}</span></div>`).join('');

  const resultFields = [TRADE_RISK_HEADER, profitPassedField, m.outcomeField, m.pnlField, pctField, m.dateField, guessBalanceField()].filter(Boolean);

  const otherFields = m.headers.filter((h) =>
    h !== m.pnlField && h !== m.outcomeField && h !== m.dateField && h !== guessBalanceField() && h !== pctField &&
    h !== directionField && h !== tokenField && h !== chartField && h !== profitPassedField && h !== TRADE_RISK_HEADER &&
    !m.factorFields.includes(h) &&
    rec[h] != null
  );

  const title = [tokenField ? rec[tokenField] : null, directionField ? rec[directionField] : null].filter(Boolean).join(' · ');
  const provenance = recordProvenanceBadge(rec);
  const chartValue = chartField ? rec[chartField] : null;
  const hasChart = isImageValue(chartValue);

  overlay.classList.remove('hidden');
  overlay.classList.remove('centered');
  overlay.innerHTML = `
    <div class="side-panel" role="dialog" aria-modal="true">
      <div class="side-panel-head">
        <div>
          <div class="side-panel-title">
            ${title ? esc(title) : 'Trade #' + sourceRow}
            ${outcomeBadge(rec._outcome)}
            ${provenance}
          </div>
          <div class="side-panel-sub">Row ${rec._sourceRow}${rec._userAdded ? '' : ` in "${esc(m.sheetName)}"`} ${rec._date ? '· ' + fmtDateUTC(rec._date) : ''}</div>
        </div>
        <button class="side-panel-close" id="closeSidePanel" aria-label="Close">${CLOSE_ICON_SVG}</button>
      </div>
      <div class="side-panel-body">
        <div class="detail-hero">
          <div class="box"><div class="k">P&amp;L</div><div class="v ${pnlClass(rec._pnl)}">${fmtMoney(rec._pnl, { plus: true })}</div></div>
          <div class="box"><div class="k">Rank</div><div class="v">${rankInfo || '—'}</div></div>
          <div class="box"><div class="k">Cumulative P&amp;L (to date)</div><div class="v ${pnlClass(cumPnl)}">${cumPnl != null ? fmtMoney(cumPnl, { plus: true }) : '—'}</div></div>
          <div class="box"><div class="k">Running Balance</div><div class="v">${runningBalance != null ? fmtMoney(runningBalance) : '—'}</div></div>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">Setup criteria</div>
          <div class="detail-grid">
            ${tokenField ? `<div class="detail-item"><span class="k">${esc(tokenField)}</span><span class="v">${esc(rec[tokenField] ?? '—')}</span></div>` : ''}
            ${directionField ? `<div class="detail-item"><span class="k">${esc(directionField)}</span><span class="v">${directionBadge(rec[directionField])}</span></div>` : ''}
            ${factorItems}
          </div>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">Result</div>
          <div class="detail-grid">
            ${resultFields.map((f) => `<div class="detail-item"><span class="k">${esc(f)}</span><span class="v">${renderResultFieldValue(f, rec)}</span></div>`).join('')}
          </div>
        </div>

        ${chartField ? `
        <div class="detail-section">
          <div class="detail-section-title">Chart</div>
          ${hasChart
            ? `<img class="chart-preview" style="cursor:zoom-in;" src="${esc(chartValue)}" alt="Chart screenshot" data-open-chart-full>`
            : `<div class="empty-state" style="padding:20px 12px;"><p>No chart screenshot attached to this trade.</p></div>`}
        </div>` : ''}

        ${otherFields.length ? `
        <div class="detail-section">
          <div class="detail-section-title">Other source fields</div>
          <div class="detail-grid">
            ${otherFields.map((f) => `<div class="detail-item"><span class="k">${esc(f)}</span><span class="v">${renderRawFieldValue(rec[f])}</span></div>`).join('')}
          </div>
        </div>` : ''}
      </div>
      <div class="side-panel-footer">
        <button class="btn btn-sm btn-outline-danger" id="deleteTradeBtn">Delete trade</button>
        <button class="btn btn-primary btn-sm" id="editTradeBtn">Edit trade</button>
      </div>
    </div>
  `;

  document.getElementById('editTradeBtn').addEventListener('click', () => openTradeForm('edit', sourceRow));
  document.getElementById('deleteTradeBtn').addEventListener('click', () => {
    showConfirmModal({
      title: 'Delete this trade?',
      message: 'This removes the trade from your session ledger and recalculates every metric that used it. This can\u2019t be undone from within the app.',
      confirmLabel: 'Delete trade',
      danger: true,
      onConfirm: () => {
        deleteTradeRecord(sourceRow);
        showTransientBanner('info', 'Trade deleted.');
      },
    });
  });
  const chartImg = overlay.querySelector('[data-open-chart-full]');
  if (chartImg) chartImg.addEventListener('click', () => openChartLightbox(chartValue));
}

function renderRawFieldValue(v) {
  if (v == null) return '<span class="text-3">—</span>';
  if (v instanceof Date) return esc(fmtDateUTC(v));
  if (/^(yes|no)$/i.test(String(v).trim())) return yesNoBadge(v);
  return esc(v);
}

function renderResultFieldValue(header, rec) {
  const v = rec[header];
  if (header === TRADE_RISK_HEADER) return v == null ? '<span class="text-3">—</span>' : fmtMoney(v);
  if (/%/.test(header) && /p&l|pnl|p\/l|profit/i.test(header)) {
    return v == null ? '<span class="text-3">—</span>' : `<span class="${pnlClass(v)}">${fmtPct(v, { plus: true })}</span>`;
  }
  return renderRawFieldValue(v);
}

function closeOverlay() {
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.add('hidden');
  overlay.classList.remove('centered');
  overlay.innerHTML = '';
}

function wireStartingBalanceControl() {
  const input = document.getElementById('startingBalanceInput');

  input.addEventListener('change', () => {

      if (Number.isFinite(n)) state.startingBalanceOverride = n;

    persistWorkingState();
    renderEquityTab();
    renderKpis();
  });

    autoBtn.addEventListener('click', () => {
      state.startingBalanceOverride = null;
      persistWorkingState();
      renderEquityTab();
      renderKpis();
    });
  }
}

/* ---- minimal, dependency-free SVG line/area chart with hover ---- */
function buildLineChart(container, points, opts) {
  const W = 960, H = opts.isDrawdown ? 220 : 300, padL = 56, padR = 16, padT = 16, padB = 28;
  const innerW = W - padL - padR, innerH = H - padT - padB;

  const values = points.map((p) => p[opts.valueKey]);
  let minV = Math.min(0, ...values), maxV = Math.max(0, ...values);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const pad = (maxV - minV) * 0.08;
  minV -= pad; maxV += pad;

  const x = (i) => padL + (points.length === 1 ? innerW / 2 : (i / (points.length - 1)) * innerW);
  const y = (v) => padT + innerH - ((v - minV) / (maxV - minV)) * innerH;
  const zeroY = y(0);

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(2)} ${y(p[opts.valueKey]).toFixed(2)}`).join(' ');
  const areaPath = `${linePath} L ${x(points.length - 1).toFixed(2)} ${zeroY.toFixed(2)} L ${x(0).toFixed(2)} ${zeroY.toFixed(2)} Z`;

  // gridlines: 4 horizontal
  const gridN = 4;
  let gridLines = '';
  for (let i = 0; i <= gridN; i++) {
    const v = minV + ((maxV - minV) * i) / gridN;
    const gy = y(v);
    gridLines += `<line x1="${padL}" y1="${gy.toFixed(2)}" x2="${W - padR}" y2="${gy.toFixed(2)}" stroke="var(--border)" stroke-width="1"/>`;
    gridLines += `<text x="${padL - 8}" y="${(gy + 3).toFixed(2)}" text-anchor="end" font-size="10" fill="var(--text-3)" font-family="var(--font-mono)">${fmtMoney(v)}</text>`;
  }

  // x-axis labels: first, middle, last date
  const idxs = points.length > 1 ? [0, Math.floor((points.length - 1) / 2), points.length - 1] : [0];
  let xLabels = '';
  for (const i of idxs) {
    const p = points[i];
    const label = p.date ? fmtDateUTC(p.date, { short: true }) : `#${i + 1}`;
    xLabels += `<text x="${x(i).toFixed(2)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--text-3)" font-family="var(--font-mono)">${esc(label)}</text>`;
  }

  const gradientId = 'grad-' + Math.random().toString(36).slice(2, 9);
  const svg = `
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" id="${gradientId}-svg">
      <defs>
        <linearGradient id="${gradientId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${opts.color}" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="${opts.color}" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <line x1="${padL}" y1="${zeroY.toFixed(2)}" x2="${W - padR}" y2="${zeroY.toFixed(2)}" stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="3,3"/>
      <path d="${areaPath}" fill="url(#${gradientId})" stroke="none"/>
      <path d="${linePath}" fill="none" stroke="${opts.color}" stroke-width="1.75"/>
      ${xLabels}
      <g id="${gradientId}-hover" style="display:none;">
        <line x1="0" y1="${padT}" x2="0" y2="${padT + innerH}" stroke="var(--border-strong)" stroke-width="1"/>
        <circle r="3.5" fill="${opts.color}" stroke="var(--bg-1)" stroke-width="1.5"/>
      </g>
    </svg>
    <div class="chart-tooltip" id="${gradientId}-tip"></div>
  `;
  container.innerHTML = svg;

  const svgEl = document.getElementById(`${gradientId}-svg`);
  const hoverG = document.getElementById(`${gradientId}-hover`);
  const hoverLine = hoverG.querySelector('line');
  const hoverDot = hoverG.querySelector('circle');
  const tip = document.getElementById(`${gradientId}-tip`);

  function onMove(evt) {
    const rect = svgEl.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const relX = ((clientX - rect.left) / rect.width) * W;
    let idx = Math.round(((relX - padL) / innerW) * (points.length - 1));
    idx = Math.max(0, Math.min(points.length - 1, idx));
    const p = points[idx];
    const px = x(idx), py = y(p[opts.valueKey]);
    hoverG.style.display = '';
    hoverLine.setAttribute('x1', px); hoverLine.setAttribute('x2', px);
    hoverDot.setAttribute('cx', px); hoverDot.setAttribute('cy', py);
    tip.classList.add('show');
    const tipLeftPct = (px / W) * 100;
    tip.style.left = tipLeftPct > 70 ? 'auto' : `calc(${tipLeftPct}% + 10px)`;
    tip.style.right = tipLeftPct > 70 ? `calc(${100 - tipLeftPct}% + 10px)` : 'auto';
    tip.style.top = '8px';
    tip.innerHTML = `
      <div class="t-date">${p.date ? esc(fmtDateUTC(p.date)) : 'Row ' + p.sourceRow}</div>
      <div class="t-row"><span class="text-2">${esc(opts.label)}</span><b>${fmtMoney(p[opts.valueKey])}</b></div>
      <div class="t-row"><span class="text-2">Trade P&amp;L</span><b class="${pnlClass(p.pnl)}">${fmtMoney(p.pnl, { plus: true })}</b></div>
    `;
  }
  function onLeave() { hoverG.style.display = 'none'; tip.classList.remove('show'); }
  svgEl.addEventListener('mousemove', onMove);
  svgEl.addEventListener('mouseleave', onLeave);
  svgEl.addEventListener('touchstart', onMove, { passive: true });
  svgEl.addEventListener('touchmove', onMove, { passive: true });
}


/* ============================================================
   FILE IMPORT
   ============================================================ */
async function handleFileUpload(file) {
  try {
    const ab = await file.arrayBuffer();
    const wb = await readWorkbook(ab);
    const dataset = buildDataset(wb, file.name);
    if (state.serverPoll.active) stopServerPolling();
    clearWorkingState();
    state.hasManualEdits = false;
    state.startingBalanceOverride = null;
    setDataset(dataset, { mode: 'uploaded', fileName: file.name });
  } catch (err) {
    console.error(err);
    showTransientBanner('error', `Couldn\u2019t read "${file.name}": ${err.message || err}. The previous dataset is still loaded.`);
  }
}

function showTransientBanner(level, text, opts) {
  const id = 't' + Date.now() + Math.random().toString(36).slice(2, 6);
  state.banners.push({ id, level, text, allowHtml: !!(opts && opts.allowHtml) });
  renderBanners();
}

/* ============================================================
   SERVER-MODE AUTO REFRESH
   ============================================================ */
async function tryInitServerPolling() {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  try {
    const res = await fetch('data/manifest.json', { cache: 'no-store' });
    if (!res.ok) return;
    const manifest = await res.json();
    if (!manifest || !manifest.file) return;
    state.serverPoll.manifestFile = manifest.file;
    await checkServerFileForUpdate(true);
    state.serverPoll.active = true;
    state.serverPoll.timer = setInterval(checkServerFileForUpdate, 5000);
    renderStatusBar();
  } catch (e) {
    // No server / no data folder reachable — silently stay in embedded/file mode.
  }
}

function stopServerPolling() {
  if (state.serverPoll.timer) clearInterval(state.serverPoll.timer);
  state.serverPoll.active = false;
  state.serverPoll.timer = null;
}

async function fnv1aHash(bytes) {
  let h = 0x811c9dc5;
  const step = Math.max(1, Math.floor(bytes.length / 200000)); // sample large files for speed
  for (let i = 0; i < bytes.length; i += step) {
    h ^= bytes[i];
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16) + ':' + bytes.length;
}

async function checkServerFileForUpdate(isInitial) {
  const file = state.serverPoll.manifestFile;
  if (!file) return;
  try {
    const res = await fetch('data/' + encodeURIComponent(file) + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const ab = await res.arrayBuffer();
    const bytes = new Uint8Array(ab);
    const hash = await fnv1aHash(bytes);
    if (hash === state.serverPoll.lastHash) return;
    const isFirstLoad = state.serverPoll.lastHash === null;
    state.serverPoll.lastHash = hash;

    if (state.hasManualEdits) {
      // Never silently clobber unsaved manual edits with a disk change —
      // just note that a newer version is available and let the person
      // choose when (or whether) to take it.
      if (!isFirstLoad && !isInitial) {
        showTransientBanner('warn', `The workbook changed on disk, but you have unsaved manual edits in this dashboard. <button class="link-btn" data-reload-from-disk="1">Discard my edits &amp; reload from disk</button>`, { allowHtml: true });
      }
      return;
    }

    const wb = await readWorkbook(ab);
    const dataset = buildDataset(wb, file);
    setDataset(dataset, { mode: 'server', fileName: file });
    if (!isFirstLoad && !isInitial) {
      showTransientBanner('info', `Workbook updated on disk — refreshed ${dataset.meta.recordCount} trade record(s) automatically.`);
    }
  } catch (e) {
    console.error('[server-poll] failed:', e);
    // transient fetch/parse error; try again on next poll rather than interrupting the user
  }
}

async function discardEditsAndReload() {
  clearWorkingState();
  state.hasManualEdits = false;
  state.startingBalanceOverride = null;
  if (state.serverPoll.active && state.serverPoll.manifestFile) {
    state.serverPoll.lastHash = null; // force re-apply even if the file content matches what we last hashed
    await checkServerFileForUpdate(true);
  } else {
    const snap = JSON.parse(JSON.stringify(EMBEDDED_SNAPSHOT_RAW));
    setDataset(reviveDataset(snap), { mode: 'embedded', fileName: snap.meta.fileName });
    showTransientBanner('info', 'Restored the embedded sample data.');
  }
}

function wireStaticEvents() {
  document.getElementById('btnUpload').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) {

      if (state.hasManualEdits) {
        showConfirmModal({
          title: 'Replace your current ledger?',
          message: `Importing "${esc(f.name)}" replaces the trades currently loaded, including anything you\u2019ve added, edited, or deleted this session.`,
          confirmLabel: 'Import & replace',
          danger: true,
          onConfirm: proceed,
        });
      } else {
        proceed();
      }
    }
    e.target.value = '';
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    const doReset = () => {
      if (state.serverPoll.active) stopServerPolling();
      clearWorkingState();
      state.hasManualEdits = false;
      state.startingBalanceOverride = null;
      const snap = JSON.parse(JSON.stringify(EMBEDDED_SNAPSHOT_RAW));
      setDataset(reviveDataset(snap), { mode: 'embedded', fileName: snap.meta.fileName });
    };
    if (state.hasManualEdits) {
      showConfirmModal({
        title: 'Discard your edits?',
        message: 'This reloads the original embedded sample data and discards any trades you\u2019ve added, edited, or deleted in this session.',
        confirmLabel: 'Discard & reset',
        danger: true,
        onConfirm: doReset,
      });
    } else {
      doReset();
    }
  });

  document.getElementById('tabNav').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (btn) switchTab(btn.dataset.tab);
  });

  document.getElementById('bannerHost').addEventListener('click', (e) => {
    const dismiss = e.target.closest('[data-dismiss]');
    if (dismiss) {
      state.banners = state.banners.filter((b) => b.id !== dismiss.dataset.dismiss);
      renderBanners();
    }
    const reloadFromDisk = e.target.closest('[data-reload-from-disk]');
    if (reloadFromDisk) discardEditsAndReload();
  });
  document.getElementById('bannerHost').addEventListener('change', (e) => {
    const sel = e.target.closest('.pnl-override-select');
    if (sel && sel.value) {
      const ds = applyPnlFieldOverride(state.dataset, sel.value);
      setDataset(ds, state.sourceMeta);
    }
  });

  document.addEventListener('click', (e) => {
    // close any open dropdown panels when clicking outside them
    document.querySelectorAll('.dropdown-panel').forEach((p) => {
      if (p.classList.contains('hidden')) return;
      const owner = p.closest('.dropdown');
      if (owner && !owner.contains(e.target)) p.classList.add('hidden');
    });
  });

  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') closeOverlay();
    if (e.target.closest('#closeSidePanel')) closeOverlay();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeOverlay();
  });

  wireSetupEvents();
  wireLedgerEvents();
}

function wireSetupEvents() {
  const root = document.getElementById('tab-setup');
  root.addEventListener('click', (e) => {
    const modeBtn = e.target.closest('#setupModeSwitch button');
    if (modeBtn) { state.setup.mode = modeBtn.dataset.mode; renderSetupShell(); return; }

    const dropdownBtn = e.target.closest('#factorDropdownBtn');
    if (dropdownBtn) { document.getElementById('factorDropdownPanel').classList.toggle('hidden'); return; }

    const selAll = e.target.closest('#factorSelectAll');
    if (selAll) { state.setup[state.setup.mode].fields = new Set(state.dataset.meta.factorFields); renderSetupControls(); updateSetupTable(); wireSetupEvents_reattachPanel(); return; }
    const selNone = e.target.closest('#factorSelectNone');
    if (selNone) { state.setup[state.setup.mode].fields = new Set(); renderSetupControls(); updateSetupTable(); wireSetupEvents_reattachPanel(); return; }

    const sortTh = e.target.closest('th[data-sort]');
    if (sortTh) {
      const s = state.setup[state.setup.mode];
      const key = sortTh.dataset.sort;
      if (s.sortKey === key) s.sortDir = s.sortDir === 'desc' ? 'asc' : 'desc';
      else { s.sortKey = key; s.sortDir = 'desc'; }
      updateSetupTable();
      return;
    }

    const viewBtn = e.target.closest('[data-view-trades]');
    if (viewBtn) {
      const filters = JSON.parse(viewBtn.dataset.viewTrades);
      state.ledger.filters = {};
      for (const f of filters) {
        state.ledger.filters[f.field] = new Set([f.value]);
      }
      state.ledger.search = '';
      switchTab('ledger');
      return;
    }
  });

  root.addEventListener('input', (e) => {
    if (e.target.id === 'setupSearch') {
      state.setup[state.setup.mode].search = e.target.value;
      updateSetupTable();
    }
    if (e.target.id === 'minTradesInput') {
      const v = Math.max(2, parseInt(e.target.value, 10) || 2);
      state.setup.signature.minTrades = v;
      updateSetupTable();
    }
  });

  root.addEventListener('change', (e) => {
    const toggle = e.target.closest('[data-factor-toggle]');
    if (toggle) {
      const s = state.setup[state.setup.mode];
      const field = toggle.dataset.factorToggle;
      if (toggle.checked) s.fields.add(field); else s.fields.delete(field);
      // update just the count badge + table, keep panel open
      document.getElementById('factorDropdownBtn').innerHTML = `Factors <span class="tab-count">${s.fields.size}/${state.dataset.meta.factorFields.length}</span>`;
      updateSetupTable();
    }
  });
}
function wireSetupEvents_reattachPanel() {
  document.getElementById('factorDropdownPanel')?.classList.remove('hidden');
}

function wireLedgerEvents() {
  const root = document.getElementById('tab-ledger');
  root.addEventListener('click', (e) => {
    const addBtn = e.target.closest('#addTradeBtn');
    if (addBtn) { openTradeForm('add'); return; }

    const viewChartsBtn = e.target.closest('#viewChartsBtn');
    if (viewChartsBtn) { openChartGallery(); return; }

    const clearLedgerBtn = e.target.closest('#clearLedgerBtn');
    if (clearLedgerBtn) {
      showConfirmModal({
        title: 'Clear the entire ledger?',
        message: `This permanently removes all ${fmtInt(state.dataset.meta.recordCount)} trade(s) from this session${state.sourceMeta.mode !== 'embedded' ? ' — re-import your workbook to get them back' : ' — use "Reset to sample" afterward to restore the sample data'}.`,
        confirmLabel: 'Clear all trades',
        danger: true,
        requireCheckbox: 'I understand this cannot be undone.',
        onConfirm: () => { clearAllTrades(); showTransientBanner('info', 'Ledger cleared.'); },
      });
      return;
    }

    const filterBtn = e.target.closest('#ledgerFilterBtn');
    if (filterBtn) { document.getElementById('ledgerFilterPanel').classList.toggle('hidden'); return; }

    const outcomeChip = e.target.closest('[data-outcome-toggle]');
    if (outcomeChip) {
      const o = outcomeChip.dataset.outcomeToggle;
      if (state.ledger.outcomeFilter.has(o)) state.ledger.outcomeFilter.delete(o); else state.ledger.outcomeFilter.add(o);
      outcomeChip.classList.toggle('on');
      updateLedgerTable();
      return;
    }

    const clearBtn = e.target.closest('#ledgerFiltersClear');
    if (clearBtn) {
      state.ledger.filters = {}; state.ledger.outcomeFilter = new Set();
      state.ledger.dateFrom = null; state.ledger.dateTo = null;
      renderLedgerShell();
      return;
    }

    const sortTh = e.target.closest('th[data-lsort]');
    if (sortTh) {
      const key = sortTh.dataset.lsort;
      if (state.ledger.sortKey === key) state.ledger.sortDir = state.ledger.sortDir === 'desc' ? 'asc' : 'desc';
      else { state.ledger.sortKey = key; state.ledger.sortDir = key === '_date' ? 'asc' : 'desc'; }
      updateLedgerTable();
      return;
    }

    const rowBtn = e.target.closest('[data-row-detail]');
    if (rowBtn) { openTradeDetail(parseInt(rowBtn.dataset.rowDetail, 10)); return; }
  });

  root.addEventListener('input', (e) => {
    if (e.target.id === 'ledgerSearch') { state.ledger.search = e.target.value; updateLedgerTable(); }
  });

  root.addEventListener('change', (e) => {
    const cb = e.target.closest('[data-ledger-filter]');
    if (cb) {
      const field = cb.dataset.ledgerFilter, value = cb.dataset.value;
      if (!state.ledger.filters[field]) state.ledger.filters[field] = new Set();
      if (cb.checked) state.ledger.filters[field].add(value); else state.ledger.filters[field].delete(value);
      updateLedgerTable();
      return;
    }
    if (e.target.id === 'ledgerDateFrom') { state.ledger.dateFrom = e.target.value || null; updateLedgerTable(); }
    if (e.target.id === 'ledgerDateTo') { state.ledger.dateTo = e.target.value || null; updateLedgerTable(); }
  });
}

async function bootstrap() {

  if (saved) {

    state.hasManualEdits = true;
    setDataset(saved.dataset, { mode: saved.sourceMeta.mode, fileName: saved.sourceMeta.fileName });

  switchTab('setup');

}


/* ============================================================
   SYNTHETIC FIELDS (dashboard-native, not from the workbook)
   ============================================================ */
const TRADE_RISK_HEADER = 'Trade Risk';
const TRADE_RISK_PCT = 0.02;

// Idempotent — safe to call every time a dataset is loaded, including one
// already carrying these fields from a previous session (restored from
// local storage).
function injectSyntheticFields(dataset) {
  const m = dataset.meta;
  if (!m.headers.includes(TRADE_RISK_HEADER)) {
    const dateIdx = m.dateField ? m.headers.indexOf(m.dateField) : -1;
    const insertAt = dateIdx >= 0 ? dateIdx + 1 : 0;
    m.headers.splice(insertAt, 0, TRADE_RISK_HEADER);
    m.columns.splice(insertAt, 0, {
      header: TRADE_RISK_HEADER, type: 'numeric', nonBlankCount: 0, numericRatio: 1,
      distinctCount: 0, distinctValues: [], isFactorCandidate: false, isMetricLike: true,
    });
  }
  for (const rec of dataset.records) {
    if (!(TRADE_RISK_HEADER in rec)) rec[TRADE_RISK_HEADER] = null;
  }
}


function findChartField(m) {
  const byType = m.columns.find((c) => c.type === 'image');
  if (byType) return byType.header;
  return m.headers.find((h) => h.trim().toUpperCase() === 'CHART') || null;
}
function findProfitPassedField(m) {
  return m.headers.find((h) => /profit.*passed.*(1:3|rr|risk|reward)/i.test(h)) || null;
}
function findPctField(m) {
  return m.columns.find((c) => /%/.test(c.header) && /p&l|pnl|p\/l|profit/i.test(c.header))?.header || null;
}

// The Add/Edit form follows a specific, curated field order (date and the
// calculated Trade Risk box up front; the result cluster — Profit Passed,
// outcome, P&L, P&L%, Chart — grouped at the end) rather than raw column
// order, since that's a much more natural order to fill a trade in. Any
// field this exact workbook doesn't have is simply skipped, so the order
// still degrades gracefully for a differently-shaped workbook.
function getFormFieldSpecs() {
  const m = state.dataset.meta;
  const specs = [];
  const seen = new Set();

  function addSpec(header, kindOverride, calcType) {
    if (header == null || seen.has(header)) return;
    seen.add(header);
    const col = m.columns.find((c) => c.header === header);
    const dropdown = m.columnDropdowns ? m.columnDropdowns[header] : null;
    let kind = kindOverride;
    if (!kind) {
      if (header === m.pnlField) kind = 'pnl';
      else if (header === m.dateField) kind = 'date';
      else if (header === TRADE_RISK_HEADER) kind = 'calculated';
      else if (col && col.type === 'image') kind = 'image';
      else if (dropdown && dropdown.length) kind = 'select';
      else if (col && col.type === 'categorical' && col.distinctCount > 0 && col.distinctCount <= 25) kind = 'select-observed';
      else if (col && col.type === 'numeric') kind = 'number';
      else kind = 'text';
    }
    const options = dropdown && dropdown.length ? dropdown : (col ? col.distinctValues : []);
    specs.push({ header, kind, options, calcType });
  }

  const tokenField = ['TOKEN', 'SYMBOL', 'PAIR'].map((p) => m.columns.find((c) => c.header.toUpperCase() === p)?.header).find(Boolean);
  const directionField = m.columns.find((c) => looksLikeDirectionField(c.header))?.header;
  const pctField = findPctField(m);
  const chartField = findChartField(m);
  const profitPassedField = findProfitPassedField(m);

  if (m.dateField) addSpec(m.dateField);
  addSpec(TRADE_RISK_HEADER, 'calculated', 'tradeRisk');
  if (tokenField) addSpec(tokenField);
  if (directionField) addSpec(directionField);
  for (const f of m.factorFields) addSpec(f);
  if (profitPassedField) addSpec(profitPassedField, 'select');
  if (m.outcomeField) addSpec(m.outcomeField, 'select');
  if (m.pnlField) addSpec(m.pnlField);
  // P&L % isn't independently meaningful — it's always P&L relative to the
  // balance the trade was taken against, so derive it automatically instead
  // of asking for two numbers that need to agree with each other.
  if (pctField) addSpec(pctField, 'calculated', 'pnlPct');
  if (chartField) addSpec(chartField, 'image');

  return specs;
}

/* ============================================================
   TRADE RISK CALCULATION
   ============================================================ */
// Add mode: 2% of the account's current overall ending balance (the
// reference a trader would size a *new* position against).
// Edit mode: 2% of the balance that existed immediately before that
// specific trade in the chronological sequence — the number that would
// actually have driven sizing at the time, and one that stays historically
// accurate even if later trades are added/edited/removed.
function computeTradeRiskBalance(mode, sourceRow) {
  const eq = getEquityCurve();
  if (mode === 'edit' && sourceRow != null) {
    const pt = eq.points.find((p) => p.sourceRow === sourceRow);
    if (pt) return pt.equity - pt.pnl;
  }
  return eq.endingBalance;
}

/* ============================================================
   FORM FIELD RENDERING
   ============================================================ */
// Renders the value + attributes for a read-only calculated field. Kept
// separate from renderFormField so the exact same markup can be rebuilt live
// as the person edits P&L (see wireCalculatedFieldSync).
function renderCalcBox(spec, existingRecord, ctx) {
  if (spec.calcType === 'tradeRisk') {
    const balance = ctx.tradeRiskBalance;
    const value = balance * TRADE_RISK_PCT;
    return `<div class="calc-box" data-field="${esc(spec.header)}" data-calc-type="tradeRisk" data-calc-value="${value}">
      ${fmtMoney(value)}
      <span class="calc-hint">= ${fmtMoney(balance)} balance × ${(TRADE_RISK_PCT * 100).toFixed(0)}%</span>
    </div>`;
  }
  if (spec.calcType === 'pnlPct') {
    const balance = ctx.tradeRiskBalance;
    const pnlRaw = existingRecord ? existingRecord[state.dataset.meta.pnlField] : null;
    const pnl = typeof pnlRaw === 'number' ? pnlRaw : (pnlRaw != null ? Number(pnlRaw) : null) || 0;
    const pct = balance ? pnl / balance : 0;
    return `<div class="calc-box" data-field="${esc(spec.header)}" data-calc-type="pnlPct" data-calc-value="${pct}" data-pct-balance="${balance}">
      ${fmtPct(pct, { plus: true })}
      <span class="calc-hint">= P&amp;L ÷ ${fmtMoney(balance)} balance</span>
    </div>`;
  }
  return `<div class="calc-box" data-field="${esc(spec.header)}" data-calc-value="0">—</div>`;
}

function renderFormField(spec, existingRecord, ctx) {
  const raw = existingRecord ? existingRecord[spec.header] : null;
  const label = esc(spec.header);
  const dataAttr = `data-field="${esc(spec.header)}"`;
  let control;
  let wrapperClass = 'form-field';

  if (spec.kind === 'date') {
    let val = '';
    if (existingRecord && existingRecord._dateISO) val = existingRecord._dateISO;
    else if (raw instanceof Date) val = raw.toISOString().slice(0, 10);
    control = `<input type="date" ${dataAttr} value="${esc(val)}">`;
  } else if (spec.kind === 'calculated') {
    control = renderCalcBox(spec, existingRecord, ctx);
    wrapperClass += ' span-2';
  } else if (spec.kind === 'image') {
    control = renderImageField(spec.header, raw, ctx);
    wrapperClass += ' span-2';
  } else if (spec.kind === 'pnl') {
    const val = raw == null ? '' : String(raw);
    control = `<input type="number" step="0.01" ${dataAttr} value="${esc(val)}" placeholder="e.g. 12.50 or -4.00">`;
  } else if (spec.kind === 'select') {
    const options = spec.options.slice();
    if (raw != null && !options.includes(String(raw))) options.push(String(raw));
    control = `<select ${dataAttr}>
      <option value="">— Select —</option>
      ${options.map((o) => `<option value="${esc(o)}" ${raw != null && String(raw) === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
    </select>`;
  } else if (spec.kind === 'select-observed') {
    const options = spec.options.slice();
    if (raw != null && !options.includes(String(raw))) options.push(String(raw));
    control = `<select ${dataAttr}>
      <option value="">— Select —</option>
      ${options.map((o) => `<option value="${esc(o)}" ${raw != null && String(raw) === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      <option value="__other__">Other…</option>
    </select>
    <input type="text" ${dataAttr} data-other-for="${esc(spec.header)}" placeholder="Type a value" style="display:none; margin-top:6px;">`;
  } else if (spec.kind === 'number') {
    control = `<input type="number" step="any" ${dataAttr} value="${raw == null ? '' : esc(String(raw))}">`;
  } else {
    control = `<input type="text" ${dataAttr} value="${raw == null ? '' : esc(String(raw))}">`;
  }
  return `<div class="${wrapperClass}"><label class="field-label">${label}</label>${control}</div>`;
}

function renderImageField(header, raw, ctx) {
  const has = isImageValue(raw);
  return `
    <div class="chart-field" data-chart-field="${esc(header)}">
      <div class="chart-upload ${has ? 'has-image' : ''}" data-chart-dropzone tabindex="0">
        ${has
          ? `<img class="chart-preview" src="${esc(raw)}" alt="Chart screenshot">
             <button type="button" class="btn btn-sm btn-ghost chart-remove" data-chart-remove>Remove</button>`
          : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
             <b>Paste a screenshot (Ctrl/Cmd+V), or click to browse</b>
             chart at entry/exit — stored on this device only`}
      </div>
      <input type="file" accept="image/*" data-chart-file class="hidden">
    </div>`;
}

function collectFormValues(formEl, imageState) {
  const values = {};
  const otherInputs = new Map();
  formEl.querySelectorAll('input[data-other-for]').forEach((el) => otherInputs.set(el.dataset.otherFor, el));

  formEl.querySelectorAll('[data-field]').forEach((el) => {
    if (el.hasAttribute('data-other-for')) return; // handled alongside its paired select
    if (el.hasAttribute('data-calc-value')) return; // read-only calculated box, handled separately
    const key = el.dataset.field;
    let v = el.value;
    if (el.tagName === 'SELECT' && v === '__other__') {
      const otherEl = otherInputs.get(key);
      v = otherEl ? otherEl.value.trim() : '';
    }
    if (v === '' || v == null) { values[key] = null; return; }
    if (el.type === 'number') {
      const n = Number(v);
      values[key] = Number.isFinite(n) ? n : null;
      return;
    }
    values[key] = v;
  });

  // Calculated fields (Trade Risk, P&L %, ...): snapshot whatever value is
  // currently shown at save time.
  formEl.querySelectorAll('[data-calc-value]').forEach((el) => {
    const key = el.dataset.field;
    const n = Number(el.dataset.calcValue);
    values[key] = Number.isFinite(n) ? n : null;
  });

  // Image fields: pull from in-memory state (can't live in a normal input value).
  if (imageState) {
    for (const [header, dataUrl] of Object.entries(imageState)) values[header] = dataUrl || null;
  }

  return values;
}

/* ============================================================
   ADD / EDIT TRADE FORM PANEL
   ============================================================ */
function openTradeForm(mode, sourceRow) {
  const existing = mode === 'edit' ? state.dataset.records.find((r) => r._sourceRow === sourceRow) : null;
  if (mode === 'edit' && !existing) return;
  const specs = getFormFieldSpecs();
  const ctx = { tradeRiskBalance: computeTradeRiskBalance(mode, sourceRow) };

  // In-memory state for image fields (paste/upload), since an <img> preview
  // isn't a normal form input with a `.value`. Seed it with whatever image
  // the record already has (edit mode).
  const imageState = {};
  for (const s of specs) {
    if (s.kind === 'image') imageState[s.header] = existing ? (existing[s.header] || null) : null;
  }

  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('hidden');
  overlay.classList.remove('centered');
  overlay.innerHTML = `
    <div class="side-panel" role="dialog" aria-modal="true">
      <div class="side-panel-head">
        <div>
          <div class="side-panel-title">${mode === 'edit' ? 'Edit Trade' : 'Add Trade'}</div>
          <div class="side-panel-sub">${mode === 'edit' ? `Row ${sourceRow} · fields mirror "${esc(state.dataset.meta.sheetName)}"` : `New trade for this session · fields mirror "${esc(state.dataset.meta.sheetName)}"`}</div>
        </div>
        <button class="side-panel-close" id="closeSidePanel" aria-label="Close">${CLOSE_ICON_SVG}</button>
      </div>
      <div class="side-panel-body">
        <form id="tradeForm">
          <div class="form-grid">${specs.map((s) => renderFormField(s, existing, ctx)).join('')}</div>
        </form>
      </div>
      <div class="side-panel-footer">
        ${mode === 'edit' ? `<button type="button" class="btn btn-sm btn-outline-danger" id="deleteTradeBtnForm">Delete trade</button>` : '<span></span>'}
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-ghost btn-sm" id="cancelTradeForm">Cancel</button>
          <button type="button" class="btn btn-primary btn-sm" id="saveTradeForm">${mode === 'edit' ? 'Save changes' : 'Add trade'}</button>
        </div>
      </div>
    </div>
  `;

  // "Other…" selects reveal their paired free-text input
  overlay.querySelectorAll('select[data-field]').forEach((sel) => {
    const key = sel.dataset.field;
    const otherInput = overlay.querySelector(`input[data-other-for="${CSS.escape(key)}"]`);
    if (!otherInput) return;
    const sync = () => { otherInput.style.display = sel.value === '__other__' ? '' : 'none'; };
    sel.addEventListener('change', sync);
    sync();
  });

  wireImageFields(overlay, imageState);
  wireCalculatedFieldSync(overlay);

  document.getElementById('cancelTradeForm').addEventListener('click', closeOverlay);
  document.getElementById('saveTradeForm').addEventListener('click', () => {
    const values = collectFormValues(document.getElementById('tradeForm'), imageState);
    if (mode === 'edit') {
      updateTradeRecord(sourceRow, values);
      showTransientBanner('info', 'Trade updated.');
    } else {
      addTradeRecord(values);
      showTransientBanner('info', 'Trade added.');
    }
    closeOverlay();
  });
  const deleteBtn = document.getElementById('deleteTradeBtnForm');
  if (deleteBtn) {
    deleteBtn.addEventListener('click', () => {
      showConfirmModal({
        title: 'Delete this trade?',
        message: 'This removes the trade from your session ledger and recalculates every metric that used it. This can\u2019t be undone from within the app.',
        confirmLabel: 'Delete trade',
        danger: true,
        onConfirm: () => { deleteTradeRecord(sourceRow); showTransientBanner('info', 'Trade deleted.'); },
      });
    });
  }
}

/* ============================================================
   CHART IMAGE FIELD — paste, browse, and remove
   ============================================================ */
// Downscale + re-encode so a multi-MB screenshot doesn't balloon local
// storage; a chart screenshot rarely needs to be pixel-perfect beyond
// ~1400px wide to be useful for a quick visual reference later.
function compressImageToDataUrl(blob, maxDim, quality) {
  maxDim = maxDim || 1400;
  quality = quality == null ? 0.82 : quality;
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.max(1, Math.round(width * scale));
        height = Math.max(1, Math.round(height * scale));
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx2d = canvas.getContext('2d');
      ctx2d.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); };
    img.src = url;
  });
}

// Keeps any calculated field that depends on the P&L input in sync as the
// person types — currently just P&L %, which is always P&L relative to the
// same balance-before-this-trade basis Trade Risk uses.
function wireCalculatedFieldSync(overlay) {
  const m = state.dataset.meta;
  if (!m.pnlField) return;
  const pnlInput = overlay.querySelector(`[data-field="${CSS.escape(m.pnlField)}"]`);
  const pctBox = overlay.querySelector('[data-calc-type="pnlPct"]');
  if (!pnlInput || !pctBox) return;
  const balance = Number(pctBox.dataset.pctBalance) || 0;
  pnlInput.addEventListener('input', () => {
    const pnl = Number(pnlInput.value) || 0;
    const pct = balance ? pnl / balance : 0;
    pctBox.dataset.calcValue = pct;
    pctBox.innerHTML = `${fmtPct(pct, { plus: true })}<span class="calc-hint">= P&amp;L ÷ ${fmtMoney(balance)} balance</span>`;
  });
}

function wireImageFields(overlay, imageState) {
  overlay.querySelectorAll('[data-chart-field]').forEach((wrap) => {
    const header = wrap.dataset.chartField;
    const dropzone = wrap.querySelector('[data-chart-dropzone]');
    const fileInput = wrap.querySelector('[data-chart-file]');

    async function setImage(blob) {
      try {
        const dataUrl = await compressImageToDataUrl(blob);
        imageState[header] = dataUrl;
        rerenderImageField(wrap, header, dataUrl);
      } catch (e) {
        showTransientBanner('warn', `Couldn\u2019t read that image: ${e.message || e}`);
      }
    }

    dropzone.addEventListener('click', (e) => {
      if (e.target.closest('[data-chart-remove]')) return;
      fileInput.click();
    });
    dropzone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });
    dropzone.addEventListener('paste', (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          e.preventDefault();
          setImage(item.getAsFile());
          return;
        }
      }
    });
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('drag-over');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) setImage(file);
    });
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) setImage(file);
      fileInput.value = '';
    });
    wrap.addEventListener('click', (e) => {
      if (e.target.closest('[data-chart-remove]')) {
        imageState[header] = null;
        rerenderImageField(wrap, header, null);
      }
    });
  });
}

function rerenderImageField(wrap, header, dataUrl) {
  const dropzone = wrap.querySelector('[data-chart-dropzone]');
  dropzone.classList.toggle('has-image', !!dataUrl);
  dropzone.innerHTML = dataUrl
    ? `<img class="chart-preview" src="${esc(dataUrl)}" alt="Chart screenshot"><button type="button" class="btn btn-sm btn-ghost chart-remove" data-chart-remove>Remove</button>`
    : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
       <b>Paste a screenshot (Ctrl/Cmd+V), or click to browse</b>
       chart at entry/exit — stored on this device only`;
}

/* ============================================================
   IMAGE LIGHTBOX — full-size view, stacks above any open panel/modal
   without disturbing it (a separate top-level element, not the shared
   #modalOverlay, so closing it returns to whatever was open underneath)
   ============================================================ */
function openChartLightbox(src) {
  if (!src) return;
  const lb = document.createElement('div');
  lb.className = 'img-lightbox';
  lb.innerHTML = `
    <button type="button" class="img-lightbox-close" aria-label="Close">${CLOSE_ICON_SVG}</button>
    <img src="${esc(src)}" alt="Chart screenshot">`;
  function close() {
    lb.remove();
    document.removeEventListener('keydown', onKeydown);
  }
  function onKeydown(e) { if (e.key === 'Escape') close(); }
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target.closest('.img-lightbox-close')) close(); });
  document.addEventListener('keydown', onKeydown);
  document.body.appendChild(lb);
}

/* ============================================================
   CHART GALLERY — browse every screenshot already attached
   ============================================================ */
function openChartGallery() {
  const m = state.dataset.meta;
  const chartField = findChartField(m);
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('hidden');
  overlay.classList.add('centered');

  if (!chartField) {
    overlay.innerHTML = `<div class="confirm-modal">${emptyState('No chart field found', 'This workbook doesn\u2019t appear to have a chart/screenshot column.')}<div class="confirm-actions"><button class="btn btn-sm" id="galleryCloseBtn">Close</button></div></div>`;
    document.getElementById('galleryCloseBtn').addEventListener('click', closeOverlay);
    return;
  }

  const withCharts = state.dataset.records
    .filter((r) => isImageValue(r[chartField]))
    .sort((a, b) => (b._date?.getTime() ?? 0) - (a._date?.getTime() ?? 0) || b._sourceRow - a._sourceRow);

  const tokenField = ['TOKEN', 'SYMBOL', 'PAIR'].map((p) => m.columns.find((c) => c.header.toUpperCase() === p)?.header).find(Boolean);

  overlay.innerHTML = `
    <div class="confirm-modal" style="max-width:640px; width:92vw;" role="dialog" aria-modal="true">
      <div style="display:flex; align-items:center; margin-bottom:14px;">
        <div>
          <div class="confirm-title" style="margin-bottom:2px;">Chart Gallery</div>
          <div class="text-3" style="font-size:11.5px;">${fmtInt(withCharts.length)} trade${withCharts.length === 1 ? '' : 's'} with a screenshot attached</div>
        </div>
        <div class="card-head-spacer"></div>
        <button class="side-panel-close" id="galleryCloseBtn" aria-label="Close">${CLOSE_ICON_SVG}</button>
      </div>
      ${withCharts.length === 0
        ? emptyState('No charts attached yet', 'Attach a screenshot to a trade\u2019s Chart field (via Add or Edit Trade) and it will show up here.')
        : `<div class="chart-gallery-grid" style="max-height:60vh; overflow:auto;">
            ${withCharts.map((r) => `
              <button type="button" class="chart-gallery-item" data-gallery-row="${r._sourceRow}">
                <img src="${esc(r[chartField])}" alt="Chart screenshot">
                <div class="chart-gallery-cap">
                  <b>${esc(tokenField ? (r[tokenField] || '—') : 'Trade #' + r._sourceRow)}</b>
                  ${r._date ? esc(fmtDateUTC(r._date, { short: true })) : '—'} · <span class="${pnlClass(r._pnl)}">${fmtMoney(r._pnl, { plus: true })}</span>
                </div>
              </button>`).join('')}
          </div>`}
    </div>`;

  document.getElementById('galleryCloseBtn').addEventListener('click', closeOverlay);
  overlay.querySelectorAll('[data-gallery-row]').forEach((btn) => {
    btn.addEventListener('click', () => openTradeDetail(parseInt(btn.dataset.galleryRow, 10)));
  });
}

/* ============================================================
   CONFIRM MODAL
   ============================================================ */
function showConfirmModal(opts) {
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('hidden');
  overlay.classList.add('centered');
  const checkboxHtml = opts.requireCheckbox ? `
    <label class="checkline" style="margin:14px 0 0;">
      <input type="checkbox" id="confirmAckBox">
      <span>${esc(opts.requireCheckbox)}</span>
    </label>` : '';
  overlay.innerHTML = `
    <div class="confirm-modal" role="alertdialog" aria-modal="true">
      <div class="confirm-title">${esc(opts.title)}</div>
      <div class="confirm-message">${opts.message}</div>
      ${checkboxHtml}
      <div class="confirm-actions">
        <button class="btn btn-ghost btn-sm" id="confirmCancelBtn">Cancel</button>
        <button class="btn btn-sm ${opts.danger ? 'btn-danger' : 'btn-primary'}" id="confirmOkBtn" ${opts.requireCheckbox ? 'disabled' : ''}>${esc(opts.confirmLabel || 'Confirm')}</button>
      </div>
    </div>`;
  const okBtn = document.getElementById('confirmOkBtn');
  const ackBox = document.getElementById('confirmAckBox');
  if (ackBox) ackBox.addEventListener('change', () => { okBtn.disabled = !ackBox.checked; });
  document.getElementById('confirmCancelBtn').addEventListener('click', closeOverlay);
  okBtn.addEventListener('click', () => { closeOverlay(); opts.onConfirm(); });
}

/* ============================================================
   MUTATIONS: add / edit / delete / clear
   ============================================================ */
function nextSyntheticRowId() {
  let max = state.dataset.meta.headerRowExcelIndex || 1;
  for (const r of state.dataset.records) if (r._sourceRow > max) max = r._sourceRow;
  return max + 1;
}

function reconcileSetupFieldSelections() {
  const valid = new Set(state.dataset.meta.factorFields);
  for (const mode of ['single', 'signature']) {
    const s = state.setup[mode];
    if (s.fields) s.fields = new Set([...s.fields].filter((f) => valid.has(f)));
  }
}

function afterMutation() {
  recomputeDatasetMeta(state.dataset);
  reconcileSetupFieldSelections();
  state.hasManualEdits = true;
  persistWorkingState();
  renderAll();
}

function addTradeRecord(values) {
  const rec = { _sourceRow: nextSyntheticRowId(), _userAdded: true };
  for (const h of state.dataset.meta.headers) rec[h] = Object.prototype.hasOwnProperty.call(values, h) ? values[h] : null;
  state.dataset.records.push(rec);
  afterMutation();
}

function updateTradeRecord(sourceRow, values) {
  const rec = state.dataset.records.find((r) => r._sourceRow === sourceRow);
  if (!rec) return;
  for (const h of state.dataset.meta.headers) {
    if (Object.prototype.hasOwnProperty.call(values, h)) rec[h] = values[h];
  }
  if (!rec._userAdded) rec._userEdited = true;
  afterMutation();
}

function deleteTradeRecord(sourceRow) {
  state.dataset.records = state.dataset.records.filter((r) => r._sourceRow !== sourceRow);
  afterMutation();
}

function clearAllTrades() {
  state.dataset.records = [];
  afterMutation();
}

/* ============================================================
   LOCAL PERSISTENCE (this device only — nothing leaves the browser)
   ============================================================ */
const STORAGE_KEY = 'barReplayDashboard.workingState.v1';

function persistWorkingState() {
  try {
    const records = state.dataset.records.map((r) => {
      const copy = { ...r };
      if (copy._date instanceof Date) copy._date = copy._date.toISOString();
      return copy;
    });
    const payload = {
      savedAt: new Date().toISOString(),
      sourceMeta: { mode: state.sourceMeta.mode, fileName: state.sourceMeta.fileName },
      startingBalanceOverride: state.startingBalanceOverride,
      dataset: { meta: state.dataset.meta, records },
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {
    // Storage unavailable (private browsing, strict file:// policies, quota) —
    // edits simply won't survive a page refresh; the app still works fine.
  }
}

function loadWorkingState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const payload = JSON.parse(raw);
    if (!payload || !payload.dataset || !Array.isArray(payload.dataset.records)) return null;
    reviveDataset(payload.dataset);
    return payload;
  } catch (e) {
    return null;
  }
}

function clearWorkingState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
}



bootstrap();

})();

</script>
